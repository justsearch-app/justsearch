# PUBLIC CI - GitHub-hosted fact lanes for the open-source JustSearch repo.
#
# Public pull requests should get fast, owner-specific feedback. Keep each job
# named after the fact it proves because main branch protection requires these
# meaningful checks instead of one opaque Windows bucket.

name: CI

on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]
  # Merge-queue readiness (tempdoc 829 R4). GitHub only reports a required check on a
  # queued merge group if the workflow producing it also fires on `merge_group`; a
  # required check that never reports on the `refs/heads/gh-readonly-queue/...` ref
  # stalls the group until the queue times it out. Inert until the repo is
  # organization-owned and a queue is configured — no merge_group event can be
  # delivered before then, so this adds zero runs today.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Read-only Actions API access for the advisory `ci-walltime` job, which reads
  # this run's own job/step timings. Grantable on fork PRs (read scope). Tempdoc 668.
  actions: read

concurrency:
  # One in-flight run per pull request, per merge group, per ref — in that order.
  # `github.event.pull_request.number` is empty on a merge_group event, so the merge
  # group's head SHA is named EXPLICITLY rather than leaning on the `github.ref`
  # fallback: two queued groups must never cancel each other, and that guarantee
  # should not rest on GitHub's ref-naming scheme. Inert for the existing events —
  # pull_request still keys on the PR number, push still falls through to github.ref
  # (both merge_group fields are empty there).
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"
  JAVA_VERSION: "25"

jobs:
  public-claims:
    name: Public claims
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The config-surface gate (added below, tempdoc 799) resolves a baseline ref to detect a
          # relaxed pin, so it needs real history. The kernel fails CLOSED on a shallow clone
          # rather than reporting a false green — correct, but it means this job cannot run on the
          # default depth-1 checkout.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/ui-web/package-lock.json

      - name: Setup Python for zero-cost claim replay
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: jseval dependency lock drift guard
        # Fails fast, before installing, if pyproject.toml's floors and the committed
        # lock (tempdoc 792 §6) disagree — e.g. a dependency added or a floor raised
        # without regenerating scripts/jseval/requirements.lock.txt.
        run: node scripts/ci/check-jseval-lock.mjs

      - name: Install canonical jseval
        # Constraint-installed against the dependency lock (tempdoc 792 §6) so the
        # measurement harness behind public claims resolves the same versions on every
        # run instead of whatever floor-only pyproject.toml + an unpinned resolver
        # happens to pick that day. `-c` only pins packages pyproject.toml already
        # requires; it can't force-install anything extra.
        run: python -m pip install -e scripts/jseval -c scripts/jseval/requirements.lock.txt

      - name: Test release composition (Python)
        # tempdoc 802. `scripts/jseval/tests/` (132 files) runs in CI NOWHERE — the same
        # orphaned-layer class as the ~26 node files D6 wired above, and the reason a test
        # added alongside a fix here would have been a claim rather than a guarantee.
        # Scoped deliberately to the ONE file guarding release composition rather than the
        # whole suite: the rest has never been run under CI's locked env, so enabling it
        # wholesale would turn `main` red on failures this change does not own. The broader
        # gap is logged for its own pass.
        # pytest/hypothesis are not in requirements.lock.txt, so `-c` leaves them unpinned;
        # that is why this installs the `dev` extra separately instead of widening the
        # canonical install above (which the lock-drift guard keys on).
        run: |
          python -m pip install --quiet "pytest>=7.0" "pyyaml>=6.0"
          python -m pytest scripts/jseval/tests/test_release.py -q

      - name: Test sandbox validation harness (Python)
        # Pillow backs plant_defects.py's mislabeled-capture re-encode (a SHA-unique
        # PNG, not a byte-copy — see the tool's docstring). Install it so the test
        # runs for real rather than skipping; a skipped test is a dormant bite.
        run: |
          python -m pip install --quiet pillow
          python -m unittest discover -s scripts/sandbox -p "test_*.py" -v

      - name: Install root dependencies
        run: npm ci

      # Tempdoc 745 D6. These ~26 files (743's baseline-economics/record-merge suites
      # included) previously ran in CI NOWHERE — manual-only, i.e. only when someone
      # remembered. That is the exact failure mode 745 documents: a layer nothing
      # invokes is dead regardless of its quality. The runner auto-discovers
      # *.test.mjs so a new test is covered the moment it lands.
      - name: Test agent-analytics instrument (node)
        run: node scripts/agent-analytics/run-all-tests.mjs

      - name: Test OTLP telemetry sink (Python)
        # otlp-sink.py hard-imports opentelemetry.proto.* to decode OTLP protobuf,
        # so the test cannot run without it. Same reasoning as the pillow install
        # above: install it so the test runs for real rather than erroring out.
        # Pinned to the version this was validated against (tempdoc 745).
        run: |
          python -m pip install --quiet opentelemetry-proto==1.43.0
          python scripts/agent-analytics/test_otlp_sink.py

      - name: Workflow trigger policy guard
        run: node scripts/ci/check-workflow-triggers.mjs

      - name: Unit-test shard policy guard
        run: node scripts/ci/verify-unit-test-shard-policy.mjs

      - name: Test evidence policy guard
        run: node scripts/ci/verify-test-evidence-policy.mjs

      - name: Root README entrypoint guard
        run: node scripts/ci/check-root-readme.mjs

      # Tempdoc 799 L.1: the ratchet shipped in 620 Move 3 but was wired to nothing,
      # so the always-loaded set drifted 18.5% past its ceiling across four sessions
      # that each logged it. Growth is still allowed — it just has to be declared
      # (`--bump <file> --reason "<why>"`), which is what an unrun check can't ask for.
      - name: Always-loaded agent-doc budget ratchet
        run: node scripts/ci/check-always-loaded-budget.mjs

      - name: Test dead-config scanner (config-surface gate)
        run: node scripts/ci/test-config-surface-dead-config.mjs

      # Tempdoc 799 Q. An adversarial review found the gate itself ran NOWHERE -- the step above
      # tests the scanner, but nothing invoked the gate on a PR. That is the same "shipped but
      # wired to nothing" shape L.1 documents for the always-loaded ratchet, reproduced in the
      # branch that documents it. Scoped to this one gate: other kernel gates need inputs (knip,
      # npm audit, a Gradle run) this fast job does not build.
      - name: Config-surface gate (dead settings + surface ratchet)
        run: |
          node scripts/docs/generate-runtime-config-matrix.mjs
          node scripts/governance/run.mjs --gate config-surface --mode gate

      - name: README benchmark numbers match the canonical release
        run: node scripts/ci/check-readme-benchmark-numbers.mjs

      - name: Outward benchmark numbers cite the canonical release
        run: node scripts/ci/check-outward-number-citations.mjs

      # Tempdoc 835: the shared llama-server argument-rejection predicate. Its previous form was a
      # string literal inside one CI script that silently stopped matching when the bundled build's
      # wording changed — so the reader of the register gets a test, not just a comment.
      - name: Test llama-server argument-rejection predicate
        run: node scripts/ci/lib/llama-server-arg-rejection.test.mjs

      - name: Test deterministic MCPB packer
        run: node scripts/ci/pack-mcpb.test.mjs

      - name: Test MCPB release-bundle consistency gate
        run: node scripts/ci/check-mcpb-consistency.test.mjs

      - name: MCPB source matches server.json.fileSha256 (release integrity + freshness)
        run: node scripts/ci/check-mcpb-consistency.mjs

      - name: Test agent-utility projection lifecycle and drift
        run: node scripts/docs/gen-public-agent-utility.test.mjs

      - name: Test agent-utility publication pointer gate
        run: node scripts/ci/check-public-agent-utility.test.mjs

      - name: Verify agent-utility publication and projections
        run: node scripts/ci/check-public-agent-utility.mjs

      - name: Test the update-preserves-models gate
        run: node scripts/ci/check-update-preserves-models.test.mjs

      # Tempdoc 617 D2 made "an update never touches models" a condition of choosing monolithic
      # full-installer updates, and §7.1 asserts it as fact. Nothing enforced it, so it held only
      # by accident of how the payload happened to be assembled. A monolithic update is
      # uninstall-then-install over a live install, so one recursive delete in an uninstall hook,
      # or one models glob in the bundle, destroys ~9 GB of user assets on first upgrade.
      - name: Update never ships or deletes models
        run: node scripts/ci/check-update-preserves-models.mjs

      # Tempdoc 801 D14.b: the release sequence is the one number that can permanently brick
      # update acceptance (updater.rs refuses anything below the client's persisted
      # highest_accepted_sequence). Its derivation runs exactly once per release cut, inside a
      # manual tag dispatch nothing else exercises — so this offline suite is the only place its
      # max-selection, fail-closed, and floor branches are ever executed.
      - name: Test the release-sequence derivation
        run: node scripts/ci/derive-release-sequence.test.mjs

      - name: Test the installer-branding gate
        run: node scripts/ci/check-installer-branding.test.mjs

      # Three sandbox rounds reported an NSIS wizard naming no version anywhere. Tempdoc 806 routed
      # it through bundle.copyright -> BrandingText; round 13 found that covered only the interior
      # pages, because MUI's Welcome and Finish pages draw no strip (tempdoc 807 R13-F1). Both
      # halves live outside any build the repo can run, so both can regress with every test green.
      - name: Installer wizard names the version it installs
        run: node scripts/ci/check-installer-branding.mjs

      # Sandbox round 9 F1 (BLOCKER): lib.rs registered tauri_plugin_updater unconditionally
      # while plugins.updater lived only in the tag-build overlay, so every non-tag candidate's
      # shell panicked at startup (PluginInitialization, exit 101) before any window or log.
      # The overlay was also missing the serde-required `pubkey`, so the first tag build would
      # have panicked identically. A registered plugin with a required config must have a valid
      # block in the BASE config.
      - name: Registered Tauri plugins have a base config block
        run: node scripts/ci/check-tauri-plugin-config.mjs

      # Round 16 (tempdoc 823/824 F4) hit a 400 from POST /api/ai/install/repair with nowhere to
      # look: the whole /api/ai/install/* family had shipped since alpha without ever appearing in
      # the API contract map. Nothing compared bound routes against documented ones.
      - name: Test the install-API contract-doc gate
        run: node scripts/ci/check-install-api-contract.test.mjs

      - name: Install API routes are documented
        run: node scripts/ci/check-install-api-contract.mjs

      # Tempdoc 837 §5.1: this gate has existed since 600 but no workflow ever invoked it — it lived
      # in the pre-merge table and three tempdocs only. That is how four ORT_CUDA_* reason codes with
      # no producer survived, two of them carrying user-facing wording for a state that cannot occur.
      # A gate nobody runs is prose, not enforcement.
      - name: Test the readiness-reason-codes gate
        run: node scripts/ci/check-readiness-reason-codes.test.mjs

      - name: Readiness reason codes are worded and produced
        run: node scripts/ci/check-readiness-reason-codes.mjs

      # Tempdoc 851 (owner decision 2026-08-19): search-v2 sat DEVELOPER/DEEPLINK for months behind
      # an ACTIVE cutover tempdoc whose parity rows were never checked, and was deleted un-promoted.
      # Nothing made that visible — a window parked "until the cutover" costs nothing to leave
      # parked. This gate keeps the retirement (its directory must stay gone) and puts a dated
      # deadline on the successor's promotion: WARN until 2026-09-30, FAIL after.
      - name: Test the window-cutover gate
        run: node scripts/ci/check-window-cutover.test.mjs

      - name: Retired window stays retired; successor cutover meets its deadline
        run: node scripts/ci/check-window-cutover.mjs

      - name: Verify frontend-stack claims
        run: node scripts/docs/check-frontend-stack-claims.mjs

      - name: Verify model-name freshness
        run: node scripts/docs/check-model-freshness.mjs

      - name: Verify privacy claims
        run: node scripts/docs/check-privacy-claims.mjs

      - name: Verify canonical docs links
        run: node scripts/docs/verify-canonical-doc-links.mjs

      - name: Verify module dependency doc is up to date
        run: node scripts/architecture/module-deps.mjs --check-canonical

      - name: Markdownlint canonical docs
        run: npx markdownlint "docs/explanation/**/*.md" "docs/reference/**/*.md" "docs/how-to/**/*.md" "docs/decisions/**/*.md"

      - name: Verify llms.txt is up to date
        run: node scripts/docs/llmstxt-generate.mjs --check

      - name: Verify synced skills are up to date
        run: node scripts/docs/skills-sync.mjs --check

  license-and-notices:
    name: License and notices
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      # Gradle caching is owned by setup-gradle, not by setup-java's `cache: gradle`
      # (tempdoc 829 R2+R7). On Windows lanes the Gradle daemon is still alive at
      # post-job save time and holds mandatory locks on ~/.gradle/caches/**/*.lock, so
      # the cache tar exited 2 (EBUSY) and the cache was NEVER saved — every Windows
      # run was a cold cache (actions/setup-java#633, workaround-only upstream).
      # setup-gradle stops daemons in its own post-action and defaults to
      # cache-read-only off the default branch, so only `main` writes entries (R7).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: modules/ui-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix modules/ui-web

      - name: Enforce the license allowlist
        run: ./gradlew.bat checkLicense --no-configuration-cache --no-parallel

      - name: Dump Rust/Cargo licenses for the NOTICE projection
        run: node scripts/codegen/dump-cargo-licenses.mjs

      - name: Dump frontend npm licenses for the NOTICE projection
        shell: cmd
        run: |
          cd modules\ui-web
          npx --yes license-checker --production --json --relativeOnly > ..\..\build\npm-licenses.json

      - name: NOTICE / THIRD_PARTY_NOTICES are in sync
        run: node scripts/ci/check-notices-regen.mjs

  build:
    name: Build (no model blobs)
    # Migrated to Linux (tempdoc 668) — assemble is compile + web-bundle, no tests,
    # so no Windows-test portability tail; protoc already fixed for Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/ui-web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Assemble without model blobs
        shell: bash
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          node scripts/ci/report-build-attribution.mjs --runner-label "ubuntu-latest" --out-json build/ci/build-attribution.json --out-md build/ci/build-attribution.md --task-timing-json build/ci/build-task-timing.json -- ./gradlew assemble -PskipWebBuild=false --console=plain

      - name: Upload build attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-attribution
          path: |
            build/ci/build-attribution.json
            build/ci/build-attribution.md
            build/ci/build-task-timing.json
          if-no-files-found: warn

  unit-tests:
    name: Unit tests (${{ matrix.lane }})
    # Per-lane runner OS (tempdoc 668 option B). app-ui is migrated to Linux (~2.8x
    # faster, validated); its Windows-specific tests are @Tag("windows") and run on
    # the separate windows-native-tests lane. search-worker / platform-contracts stay
    # on Windows pending their own Linux validation.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: app-ui
            os: ubuntu-latest
            artifact: unit-test-attribution-app-ui
            runner_label: ubuntu-latest/app-ui
            gradle_tasks: >-
              :modules:app-agent:test
              :modules:app-agent-api:test
              :modules:app-api:test
              :modules:app-api-tck:test
              :modules:app-config:test
              :modules:app-launcher:test
              :modules:app-observability:test
              :modules:app-services:test
              :modules:app-util:test
              :modules:ui:test
          - lane: search-worker
            os: ubuntu-latest
            artifact: unit-test-attribution-search-worker
            runner_label: ubuntu-latest/search-worker
            gradle_tasks: >-
              :modules:adapters-lucene:test
              :modules:configuration:test
              :modules:core:test
              :modules:core-contracts:test
              :modules:indexer-worker:test
              :modules:indexing:test
              :modules:ipc-common:test
              :modules:worker-core:test
              :modules:worker-services:test
          - lane: platform-contracts
            os: ubuntu-latest
            artifact: unit-test-attribution-platform-contracts
            runner_label: ubuntu-latest/platform-contracts
            gradle_tasks: >-
              :modules:ai-backend:test
              :modules:api-contract-projection-java:test
              :modules:app-inference:test
              :modules:benchmarks:test
              :modules:dead-code-audit:test
              :modules:extension-substrate:test
              :modules:gpu-bridge:test
              :modules:infra-core:test
              :modules:ort-common:test
              :modules:prompt-support:test
              :modules:reranker:test
              :modules:ssot-tools:test
              :modules:system-tests:test
              :modules:telemetry:test
              :modules:test-support:test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests with model-dependent tests self-skipping
        id: gradle-test
        shell: bash
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          GW='./gradlew'; [ "$RUNNER_OS" = "Windows" ] && GW='./gradlew.bat'
          "$GW" ${{ matrix.gradle_tasks }} -PskipWebBuild=true --console=plain

      - name: Report unit-test attribution
        if: always()
        run: node scripts/ci/report-unit-test-attribution.mjs --lane "${{ matrix.lane }}" --runner-label "${{ matrix.runner_label }}" --out-json build/ci/unit-test-attribution.json --out-md build/ci/unit-test-attribution.md --top 20 --allow-empty

      - name: Report unit-test advisory budget
        if: always()
        run: node scripts/ci/report-unit-test-budget.mjs --lane "${{ matrix.lane }}" --attribution build/ci/unit-test-attribution.json --out-json build/ci/unit-test-budget.json --out-md build/ci/unit-test-budget.md

      - name: Upload unit-test attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/ci/unit-test-attribution.json
            build/ci/unit-test-attribution.md
            build/ci/unit-test-budget.json
            build/ci/unit-test-budget.md
            modules/**/build/test-results/test/TEST-*.xml
          if-no-files-found: warn

  # Tempdoc 668 option B — runs ONLY the @Tag("windows") tests (single-instance lock,
  # job objects, power status) on Windows, preserving coverage of genuinely Windows-
  # specific product behaviour that the Linux-migrated lanes (app-ui) skip. Small + fast
  # (a handful of classes via -PwindowsOnly). Covers the modules moved to Linux so far.
  windows-native-tests:
    name: Windows-native tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Windows-only tests (@Tag windows) for the Linux-migrated modules
        run: ./gradlew.bat :modules:app-util:test :modules:app-agent:test :modules:app-services:test :modules:adapters-lucene:test :modules:app-inference:test -PwindowsOnly=true --console=plain

  # The `shell` crate ran in NO lane until now. The only `cargo` invocation anywhere in CI was
  # `dump-cargo-licenses.mjs` (this file, "License and notices"), which compiles nothing. So
  # `modules/shell/src-tauri/src/updater.rs` — the durable upgrade-intent state machine,
  # shutdown-receipt validation, installer-launch witness, and restart reconciliation — had its
  # unit tests run only on an author's machine and cited as implementation evidence, with nothing
  # re-running them. A regression there lands in the one code path whose failure mode is a
  # bricked user install.
  #
  # Not hypothetical: this lane was added while fixing a defect it would have caught — restart
  # reconciliation validated the Head shutdown receipt against the receipt's *own* PID field,
  # making the check tautological on exactly the path where the live process witness is gone
  # (tempdoc 617). The regression test now lives beside it.
  #
  # Windows, not ubuntu: the crate is Windows-specific (ShellExecuteExW installer handoff,
  # webview2, NSIS hooks). It has never been built on Linux; moving it there is a separate
  # exercise with its own evidence, not an assumption to make here.
  #
  # The placeholder step: tauri.conf.json bundles `resources/headless/**/*`, which is produced by
  # `:modules:ui:bundleSidecarResources` (a jlink runtime image plus jars, several minutes), and
  # tauri_build fails the build script outright when that glob matches nothing. Without the
  # placeholder, a pure-logic unit-test lane would have to build the entire sidecar payload to
  # compile. The directory is gitignored and packaging is unaffected: build-installer.yml stages
  # the real bundle before it packages anything.
  shell-rust-tests:
    name: Shell crate tests (Rust)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/shell/src-tauri

      - name: Stage bundle-resource placeholder
        shell: pwsh
        run: |
          $dir = 'modules/shell/src-tauri/resources/headless'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path "$dir/.ci-placeholder" -Encoding utf8 `
            -Value 'Resolves the tauri bundle resource glob for the unit-test lane. Not a payload.'

      - name: Cargo test
        working-directory: modules/shell/src-tauri
        run: cargo test --lib --locked

  # `:modules:system-tests:integrationTest` ran in NO lane until now: ci.yml ran only
  # `:modules:system-tests:test`, and the module's `check` depends on `test` alone
  # (modules/system-tests/build.gradle.kts:297). The tier rotted unobserved as a result —
  # every IsolatedBackendFixture class was failing at @BeforeAll with
  # `ClassNotFoundException: io.justsearch.ui.HeadlessApp` and nobody noticed, because
  # nothing ran it. This job closes that blind spot.
  #
  # Own job, not folded into windows-native-tests: that lane is deliberately "@Tag(windows)
  # only, small + fast", and this file's header requires each job be named after the fact it
  # proves rather than becoming "one opaque Windows bucket".
  #
  # Windows, not ubuntu: the tier spawns a real Head child JVM (HeadlessApp), which in turn
  # spawns the Worker from `:modules:indexer-worker:installDist` — process spawn, argfile
  # classpath quoting, and worker-lib path resolution are exactly the surfaces that differ per
  # OS, and Windows is the OS the product ships on. The tier has never been validated on Linux;
  # moving it there is a separate exercise with its own evidence, not an assumption to make here.
  #
  # ADVISORY (continue-on-error + deliberately absent from workflow-signal-policy.v1.json's
  # requiredStatusChecks, same pattern as `ci-walltime`): the HeadlessApp classpath rot above is
  # still open on `main`, so a blocking lane would red-wall every PR on a known, unrelated
  # failure. Advisory already closes the blind spot the tier had — it now runs on every PR and
  # its results are visible and archived, so rot cannot be silent again. Flip
  # `continue-on-error` off and add "Integration tests (system-tests tier)" to
  # requiredStatusChecks once the tier is green.
  integration-tests:
    name: Integration tests (system-tests tier)
    runs-on: windows-latest
    # Must stay above the Gradle task timeout (modules/system-tests/build.gradle.kts, 30 min),
    # or the job is killed first and the artifact-upload step below never runs. 30 min + the
    # measured 1m26s of checkout/setup/post steps (run 31716264505) leaves ~3.5 min of margin.
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # No model blobs on a public checkout, so the model-dependent cases self-skip via their
      # own assumeTrue guards; the Golden Corpus cases use frozen vectors and need no model.
      - name: Integration tier (Golden Corpus, relevance, isolated-backend E2E)
        run: ./gradlew.bat :modules:system-tests:integrationTest -PskipWebBuild=true --console=plain

      # PR #447 review fix: R3 (failOnPassedAfterRetry=false for this advisory lane, above in
      # modules/system-tests/build.gradle.kts) keeps a self-recovered boot flake from reddening
      # this job, but that alone drops ALL automated surfacing of the flake class — it would
      # only be visible via manual log/XML archaeology in the uploaded artifact below. This step
      # closes that gap the same way the unit-tests matrix already does (R5, same PR): extract
      # flakyTests from the just-produced JUnit XML into an attribution report. No budget step
      # here deliberately — report-unit-test-budget.mjs throws when a lane isn't declared in
      # unit-test-shard-policy.v1.json, and integration-tests isn't a unit-test shard.
      - name: Report integration-test attribution
        if: always()
        run: node scripts/ci/report-unit-test-attribution.mjs --lane integration-tests --runner-label windows-latest --out-json build/ci/integration-test-attribution.json --out-md build/ci/integration-test-attribution.md --top 20 --allow-empty

      - name: Upload integration-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            modules/system-tests/build/test-results/integrationTest/TEST-*.xml
            modules/system-tests/build/reports/tests/integrationTest/**
            modules/system-tests/build/reports/isolated-backend/**
            build/ci/integration-test-attribution.json
            build/ci/integration-test-attribution.md
          if-no-files-found: warn

  # Runs the MIT-licensed gitleaks CLI directly instead of gitleaks/gitleaks-action.
  # The action is a wrapper that (a) demands a paid GITLEAKS_LICENSE secret as soon as
  # the repository owner is an organization — with no public-repo exemption — and
  # (b) hard-exits on any event outside push/pull_request/workflow_dispatch/schedule,
  # which includes merge_group. Both would turn this REQUIRED check red the day the
  # repo moves to an org and a merge queue is enabled. The CLI has neither limit.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pin the release and verify its checksum: the binary is fetched from a
      # third-party release page into a job that reads the whole repository.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks CLI
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # `dir` scans the checked-out tree rather than a commit range. Every PR lands on
      # main as a single squashed commit (ADR-0045), so the tree that this job scans is
      # exactly the content that would land — and main's history stays clean by
      # induction. The binary and its archive live in RUNNER_TEMP so they are not
      # themselves scanned. Any finding exits non-zero and fails this required check.
      - name: Gitleaks
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path "${RUNNER_TEMP}/gitleaks-results.sarif"

      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: warn

  # Advisory only — NOT a required check (see workflow-signal-policy.v1.json
  # requiredStatusChecks; do not add this job's name there). Runs after every
  # lane so it can read all sibling job/step timings and attribute the run's
  # wall-clock: which lane is the critical path, and how much of each lane is
  # fixed runner tax vs work. Warn-only budget; never fails the run. Tempdoc 668.
  ci-walltime:
    name: CI wall-clock attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [public-claims, license-and-notices, build, unit-tests, integration-tests, secret-scan]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch this run's job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --paginate > build/ci/run-jobs.json

      # Same-run cross-job download (needs no extra permission; the unit lanes are
      # in `needs`). Lets the attribution split each unit lane's opaque test step
      # into test CPU vs framework overhead. continue-on-error so a cancelled lane
      # (no artifact) degrades to "no breakdown" instead of failing this advisory job.
      - name: Download unit-test attributions (for the test-vs-overhead split)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: unit-test-attribution-*
          path: build/ci/unit-artifacts

      - name: Report wall-clock attribution
        run: node scripts/ci/report-ci-walltime-attribution.mjs --jobs-json build/ci/run-jobs.json --unit-attribution-dir build/ci/unit-artifacts --run-id "${{ github.run_id }}" --repository "${{ github.repository }}" --workflow "${{ github.workflow }}" --self-job "CI wall-clock attribution" --out-json build/ci/ci-walltime-attribution.json --out-md build/ci/ci-walltime-attribution.md

      - name: Report wall-clock advisory budget
        run: node scripts/ci/report-ci-walltime-budget.mjs --attribution build/ci/ci-walltime-attribution.json --out-json build/ci/ci-walltime-budget.json --out-md build/ci/ci-walltime-budget.md

      - name: Upload wall-clock attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-walltime-attribution
          path: |
            build/ci/ci-walltime-attribution.json
            build/ci/ci-walltime-attribution.md
            build/ci/ci-walltime-budget.json
            build/ci/ci-walltime-budget.md
          if-no-files-found: warn
