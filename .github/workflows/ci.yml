# PUBLIC CI - GitHub-hosted fact lanes for the open-source JustSearch repo.
#
# Public pull requests should get fast, owner-specific feedback. Keep each job
# named after the fact it proves because main branch protection requires these
# meaningful checks instead of one opaque Windows bucket.

name: CI

on:
  workflow_dispatch: {}
  pull_request:
  push:
    branches: [main]
  # Merge-queue readiness (tempdoc 829 R4). GitHub only reports a required check on a
  # queued merge group if the workflow producing it also fires on `merge_group`; a
  # required check that never reports on the `refs/heads/gh-readonly-queue/...` ref
  # stalls the group until the queue times it out. Inert until the repo is
  # organization-owned and a queue is configured — no merge_group event can be
  # delivered before then, so this adds zero runs today.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  # Read-only Actions API access for the advisory `ci-walltime` job, which reads
  # this run's own job/step timings. Grantable on fork PRs (read scope). Tempdoc 668.
  actions: read

concurrency:
  # One in-flight run per pull request, per merge group, per ref — in that order.
  # `github.event.pull_request.number` is empty on a merge_group event, so the merge
  # group's head SHA is named EXPLICITLY rather than leaning on the `github.ref`
  # fallback: two queued groups must never cancel each other, and that guarantee
  # should not rest on GitHub's ref-naming scheme. Inert for the existing events —
  # pull_request still keys on the PR number, push still falls through to github.ref
  # (both merge_group fields are empty there).
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"
  JAVA_VERSION: "25"

jobs:
  public-claims:
    name: Public claims
    runs-on: ubuntu-latest
    # 15 -> 20 -> 30: this required lane exhausted both former limits while building kernel
    # gate inputs after every earlier check had passed. The replacement GitHub advisory producer
    # is independently bounded and fails closed; leave remaining runner/install variance enough
    # headroom so a timeout does not turn every PR red instead of reporting a failed check.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The config-surface gate (added below, tempdoc 799) resolves a baseline ref to detect a
          # relaxed pin, so it needs real history. The kernel fails CLOSED on a shallow clone
          # rather than reporting a false green — correct, but it means this job cannot run on the
          # default depth-1 checkout.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/ui-web/package-lock.json
            scripts/wire-contract/package-lock.json

      - name: Setup Python for zero-cost claim replay
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: jseval dependency lock drift guard
        # Fails fast, before installing, if pyproject.toml's floors and the committed
        # lock (tempdoc 792 §6) disagree — e.g. a dependency added or a floor raised
        # without regenerating scripts/jseval/requirements.lock.txt.
        run: node scripts/ci/check-jseval-lock.mjs

      - name: Install canonical jseval
        # Constraint-installed against the dependency lock (tempdoc 792 §6) so the
        # measurement harness behind public claims resolves the same versions on every
        # run instead of whatever floor-only pyproject.toml + an unpinned resolver
        # happens to pick that day. `-c` only pins packages pyproject.toml already
        # requires; it can't force-install anything extra.
        run: python -m pip install -e scripts/jseval -c scripts/jseval/requirements.lock.txt

      - name: Test release composition (Python)
        # tempdoc 802. Kept in THIS lane, alongside the claim checks it protects, so a
        # release-composition break fails the check named "Public claims" rather than only
        # the separate suite job. The rest of `scripts/jseval/tests/` now runs in the
        # `jseval-suite` job below (tempdoc 930 §18.1 row 7 closed the "runs in CI
        # NOWHERE" gap this comment used to record).
        # pytest is not in requirements.lock.txt, so `-c` leaves it unpinned; that is why
        # this installs it separately instead of widening the canonical install above
        # (which the lock-drift guard keys on).
        run: |
          python -m pip install --quiet "pytest>=7.0" "pyyaml>=6.0"
          python -m pytest scripts/jseval/tests/test_release.py -q

      - name: Test sandbox validation harness (Python)
        # Pillow backs plant_defects.py's mislabeled-capture re-encode (a SHA-unique
        # PNG, not a byte-copy — see the tool's docstring). Install it so the test
        # runs for real rather than skipping; a skipped test is a dormant bite.
        run: |
          python -m pip install --quiet pillow
          python -m unittest discover -s scripts/sandbox -p "test_*.py" -v

      # A lockfile can install fine under the npm that wrote it and still be REFUSED by the
      # runner's npm ("Missing: X@V from lock file"), because writing prunes edges the reader
      # demands. Nothing local caught that; three jobs went red on it. This reads all five
      # lockfiles offline and fails on the same condition, before any install runs.
      - name: Lockfiles name every declared dependency edge
        run: node scripts/ci/check-lockfile-completeness.mjs

      - name: Install root dependencies
        # The identity gate below is the authoritative audit for this lockfile. npm's install-time
        # audit duplicates it through an unbounded advisory POST and has blocked this lane for 5m.
        run: npm ci --audit=false

      - name: Test language-agnostic authored-word-list scanner
        run: node scripts/ci/lib/language-agnostic-word-lists.test.mjs

      - name: Search analysis remains language-agnostic
        run: node scripts/ci/check-language-agnostic-analysis.mjs

      # Tempdoc 745 D6. These ~26 files (743's baseline-economics/record-merge suites
      # included) previously ran in CI NOWHERE — manual-only, i.e. only when someone
      # remembered. That is the exact failure mode 745 documents: a layer nothing
      # invokes is dead regardless of its quality. The runner auto-discovers
      # *.test.mjs so a new test is covered the moment it lands.
      - name: Test agent-analytics instrument (node)
        run: node scripts/agent-analytics/run-all-tests.mjs

      - name: Verify Codex agent parity
        run: node scripts/ci/check-codex-agent-parity.mjs

      - name: Test OTLP telemetry sink (Python)
        # otlp-sink.py hard-imports opentelemetry.proto.* to decode OTLP protobuf,
        # so the test cannot run without it. Same reasoning as the pillow install
        # above: install it so the test runs for real rather than erroring out.
        # Pinned to the version this was validated against (tempdoc 745).
        run: |
          python -m pip install --quiet opentelemetry-proto==1.43.0
          python scripts/agent-analytics/test_otlp_sink.py

      - name: Workflow trigger policy guard
        run: node scripts/ci/check-workflow-triggers.mjs

      - name: Test workflow npm audit policy
        run: node scripts/ci/test-check-workflow-npm-audit-policy.mjs

      - name: Workflow npm install audit policy guard
        run: node scripts/ci/check-workflow-npm-audit-policy.mjs

      - name: Test lockfile completeness guard
        run: node scripts/ci/test-check-lockfile-completeness.mjs

      # Runs here rather than next to the PMD step in `Build (no model blobs)`: it reads three XML
      # files and needs no JDK, no compile and no Gradle. Its subject is drift between rulesets that
      # are inlined copies of each other, plus the file-path `rule ref` that makes PMD analyse zero
      # files while Gradle reports success (tempdoc 930 §22.2 follow-up 10).
      - name: Test PMD ruleset-sync guard
        run: node --test scripts/ci/check-pmd-ruleset-sync.test.mjs

      - name: PMD rulesets agree with their authority
        run: node scripts/ci/check-pmd-ruleset-sync.mjs

      - name: Test publish preflight contract
        run: node scripts/ci/test-run-publish-preflight.mjs

      - name: Required-check local reproduction inventory is complete
        run: node scripts/ci/run-publish-preflight.mjs --check

      - name: Test platform lifecycle evidence policy
        run: node scripts/ci/check-platform-lifecycle.test.mjs

      # Advisory by design: invalid or unreadable evidence still fails closed, while a valid
      # superseded/support finding is reported for an owner decision instead of making every PR red.
      - name: Report platform lifecycle evidence
        run: node scripts/ci/check-platform-lifecycle.mjs --mode report

      - name: Screenshot-step coverage matches the reachable UI catalog
        run: node scripts/ci/check-ui-step-coverage.mjs

      - name: Release metadata projection tests
        run: |
          node --test scripts/release/release-changelog.test.mjs
          node scripts/release/release-changelog.mjs check

      - name: Model-promotion planner tests
        run: python -m unittest discover -s scripts/models/tests -p "test_*.py" -v

      - name: Unit-test shard policy guard
        run: node scripts/ci/verify-unit-test-shard-policy.mjs

      - name: Test evidence policy guard
        run: node scripts/ci/verify-test-evidence-policy.mjs

      - name: Root README entrypoint guard
        run: node scripts/ci/check-root-readme.mjs

      # Tempdoc 799 L.1: the ratchet shipped in 620 Move 3 but was wired to nothing,
      # so the always-loaded set drifted 18.5% past its ceiling across four sessions
      # that each logged it. Growth is still allowed — it just has to be declared
      # (`--bump <file> --reason "<why>"`), which is what an unrun check can't ask for.
      - name: Always-loaded agent-doc budget ratchet
        run: node scripts/ci/check-always-loaded-budget.mjs

      # Tempdoc 949 §5: CLAUDE.md's fix-root-causes rule has claimed since it was written that
      # "the suppression subset is ratcheted by check-suppression-ratchet.mjs" — the script existed
      # and no workflow ran it, the same shape as the budget ratchet above before 799 L.1. Green on
      # main at wiring time (1 file, 3 suppressions, all baselined).
      - name: Suppression ratchet (@Disabled / noinspection baseline)
        run: node scripts/ci/check-suppression-ratchet.mjs

      # Tempdoc 930 §18.1 row 8 / §19.3 F4: docs/tempdocs/ is append-only design history, so nothing
      # shrinks a tempdoc back down on its own — the same always-loaded-budget argument above, applied
      # to working history. Only tempdocs TOUCHED in this diff are checked (a pre-existing over-cap
      # tempdoc nobody touched doesn't fail an unrelated PR). The PR base is passed explicitly when one
      # exists; on push/merge_group the script's own default (origin/main, else HEAD~1) applies — this
      # job's `fetch-depth: 0` checkout above gives both enough history to resolve.
      - name: Tempdoc size cap (per number, evidence sidecar exempt)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            node scripts/ci/check-tempdoc-size.mjs --base "$PR_BASE_SHA"
          else
            node scripts/ci/check-tempdoc-size.mjs
          fi

      # Tempdoc 872: the ui-web gate set (authority: the `ui-web-gates` recipe in
      # governance/consult-register.v1.json) was advisory-only — pushed at edit time, run in
      # CI nowhere — so `gen-token-names --check` sat RED on main for weeks and twelve sessions
      # each re-discovered and wrote it down. A state main can hold silently is a memory
      # generator; this makes it impossible instead.
      - name: ui-web pre-merge gate set
        run: node scripts/ci/run-ui-web-gates.mjs

      # The runner parses recipe prose; this pins the parse against the names in the recipe
      # and the floor guard, so a reworded recipe cannot shrink the set to a silent green.
      - name: ui-web gate runner parses the whole recipe
        run: node scripts/ci/run-ui-web-gates.test.mjs

      # Tempdoc 872: the observations inbox is retired; a shard from a session still on the
      # old brief would otherwise land unread. Fail legibly, with the routing remedy.
      - name: no observations shards (inbox retired)
        run: node scripts/ci/check-no-observations-shards.mjs

      # Tempdoc 879. Both gates below existed only as manual pre-merge rows, which is the same
      # defect they check for: a mechanism nothing runs cannot contradict anything. The store
      # register's gate was in fact RED on main for ~90 commits (an unclassified persistence
      # write site) precisely because no workflow invoked it. Wired here in the PR that fixes
      # it, not left as a follow-up.
      - name: Test policy-axis liveness attribution
        run: node scripts/ci/check-policy-axis-liveness.test.mjs

      - name: Operation policy axes have live consumers
        run: node scripts/ci/check-policy-axis-liveness.mjs

      - name: Test store-recoverability register checks
        run: node scripts/ci/check-store-recoverability.test.mjs

      - name: Store-recoverability register agrees with the code
        run: node scripts/ci/check-store-recoverability.mjs

      - name: Test dead-config scanner (config-surface gate)
        run: node scripts/ci/test-config-surface-dead-config.mjs

      # Tempdoc 856. Same shape as the block below, found the same way: the squash-message
      # preview has had tests since it shipped, and no workflow ever invoked them --
      # run-all-tests.mjs only discovers scripts/agent-analytics/**. 856 added trailer checks
      # to that script, which would have landed equally unrun. Wired here rather than left as
      # a follow-up, per retire-with-a-sweep's evasion clause.
      - name: Test squash-message preview
        run: node scripts/ci/test-preview-squash-message.mjs

      - name: Test publication-record projection
        run: node scripts/ci/test-squash-message-projection.mjs

      - name: Test managed PR review record
        run: node scripts/ci/test-pr-review-record.mjs

      - name: Test validated publication enqueue
        run: node scripts/dev/run-gh.test.mjs

      - name: Test direct publication-merge guard
        run: node scripts/agent-analytics/hooks/publication-merge-guard.test.mjs

      - name: Test bounded advisory reporting
        run: node scripts/ci/test-report-github-advisories.mjs

      # Tempdoc 884 PR 2. Same shape again, third time in this file: check-tempdoc-numbers is a
      # merge gate, and its collision rule had no test at all until 884 had to loosen one branch
      # of it. A loosened collision rule fails silently -- the regression is the case that STOPS
      # firing -- so the pin is wired here rather than left as a script nobody runs.
      - name: Test tempdoc/changeset number-collision scanner
        run: node scripts/ci/test-tempdoc-scan.mjs

      # Tempdoc 799 Q. An adversarial review found the gate itself ran NOWHERE -- the step above
      # tests the scanner, but nothing invoked the gate on a PR. That is the same "shipped but
      # wired to nothing" shape L.1 documents for the always-loaded ratchet, reproduced in the
      # branch that documents it.
      #
      # 884 §F row 9 found the same thing one layer out: dead-code, npm-audit and module-deps are
      # registered, baselined and unable to notice anything, because this job built none of their
      # inputs. gates/dead-code/baseline.txt had gone untouched since 2026-07-16 while 27 findings
      # accumulated behind it. The inputs are cheap -- measured locally at 0.2s (module-deps),
      # 2.7s (knip) and 4.5s (the original npm audit) -- so the reason they were missing was wiring,
      # not budget. Tempdoc 921 later replaced that unreliable POST with bounded GitHub advisory GETs.
      # Tempdoc 918 item 2, closing 913 open item 1. Each unwired gate was run bare on
      # the base and classified (census: tempdoc 918 §D). These 11 are green on `main` AND hermetic
      # -- they read checked-in registers, catalogs and source text, and need no produced artifact,
      # no Gradle output, no protoc and no dev stack. The step sits DELIBERATELY above the
      # `npm ci --prefix modules/ui-web` below, so the job itself demonstrates the claim rather
      # than asserting it: if one of these ever starts needing an install, it fails here.
      #
      # Tempdoc 930 chunk F removed three ids from this list by deleting their gates, not by
      # unwiring them: `todo-fixme` is now ESLint `no-warning-comments` (ui-web) + the PMD
      # `CommentContent` rule (Java), `test-to-code` was dropped, and `prose-tier-register`
      # retired with docs/reference/contributing/tier-register.md. `ts-any` (ESLint
      # `no-explicit-any` + eslint-suppressions.json) went the same way. `npm-audit` did NOT --
      # it is still a registered, baselined gate and still runs in the built-inputs step below.
      #
      # Four gates are still NOT in this step:
      #   - consumer-presence, host-owns-truth, runtime-witness
      #                  all three read tmp/consumer-presence/registry-snapshot.json, a Gradle
      #                  artifact (RegistrySnapshotExporterTest), and SOFT-FAIL to `pass` when it
      #                  is absent (consumer-presence/enforcer.mjs:36-46). Running them here would
      #                  have inspected nothing -- the first version of this step did exactly that
      #                  and logged three `snapshot-missing` warnings as part of a green. They now
      #                  run in the unit-tests app-ui lane, after the task that builds the snapshot.
      #   - test-efficacy its PIT strength report is an ON-DEMAND input, so without a `:pitest` run
      #                  the runner SKIPS it (kernel/input-skipped, verdict `skipped`, exit 0).
      #                  Wiring it here would add a step that can only ever report a vacuous green.
      #                  It belongs in a lane that produces the report.
      #   - wire         has its own step below, with the buf CLI installed ahead of it.
      - name: Hermetic kernel gates (11, no produced inputs, no install)
        run: |
          node scripts/governance/run.mjs             --gate consumer-drift --gate contract-projection --gate contribution-surface             --gate hook-integrity --gate interaction-surface --gate observed-happening             --gate runtime-state --gate ssot-catalog-sync             --gate stage-completeness --gate surface-altitude --gate tempdoc-wiring             --mode gate

      # Tempdoc 930 chunk F. Seven `check-*-regen.mjs` wrappers were one property each -- "a
      # generated file matches its source" -- with seven CI steps. `regen-all` is that set; the
      # `notices` entry needs the license reports, so it runs in the license-and-notices job that
      # builds them (`--only notices`) rather than being skipped here.
      - name: Generated files match their sources (regen set)
        run: node scripts/ci/regen-all.mjs --check --except notices

      - name: Test the regen set runner
        run: node scripts/ci/regen-all.test.mjs

      - name: Build kernel gate inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix modules/ui-web --audit=false
          node scripts/docs/generate-runtime-config-matrix.mjs
          node scripts/architecture/module-deps.mjs
          node scripts/ci/report-github-advisories.mjs
          npm --prefix modules/ui-web run knip:report

      # `npm-audit` is NOT one of the six gates tempdoc 930 chunk F retired -- it stays registered,
      # baselined and wired here. Chunk F first swapped it for plain `npm audit --audit-level=high`
      # over both lockfiles; that step was red on the base for pre-existing high advisories that
      # no PR introduced, which is the same objection the comment above raises against wiring a
      # known red. The commodity command has no accepted-advisory baseline, so it cannot
      # distinguish "new advisory" from "advisory we already carry" -- which is the one thing this
      # ratchet exists to do. The upgrades that clear those advisories have since landed and the
      # accepted set is empty (ADR-0044 amendment 2026-09-05), so the gate now fails on the first
      # high/critical identity in any of the five lockfiles. `actions/dependency-review-action`
      # was evaluated as a replacement in the same pass and rejected: it scores a revision diff,
      # not the checked-out lockfile.
      - name: Kernel gates with built inputs (config-surface, dead-code, npm-audit, module-deps)
        run: |
          node scripts/governance/run.mjs \
            --gate config-surface --gate dead-code --gate npm-audit --gate module-deps \
            --mode gate

      # Tempdoc 930 chunk F: the `ts-any` and `todo-fixme` gates became ESLint rules, and ESLint
      # ran in no workflow -- so the rules would have been unenforced the moment the gates went.
      # `eslint-suppressions.json` carries the pre-existing violations; a NEW one fails here.
      - name: Frontend lint (ts-any + todo-fixme successors)
        run: npm --prefix modules/ui-web run lint

      # Tempdoc 930 section 22.2 follow-up 3 closes the other half of the same hole. The retired
      # `todo-fixme` gate scanned `scripts/**` and `*.ps1` too, and neither successor above
      # covered them: ESLint ran only in modules/ui-web, PMD only sees Java. `lint:scripts` is the
      # root ESLint config (eslint.config.mjs, ~575 .mjs/.cjs files plus the packaging JS);
      # `lint:ps1` is the PowerShell equivalent, which ESLint cannot parse. Both carry their
      # pre-existing markers in a suppression list, so a NEW marker fails here.
      - name: Script lint (todo-fixme successor for scripts/** and *.ps1)
        run: |
          npm run lint:scripts
          npm run test:lint-ps1
          npm run lint:ps1

      # Required dev-MCP contract: generated runtime freshness/licensing, exact dependency-free
      # launcher topology, typed observation truth, canonical inventory sync, pure helper logic,
      # and real stdio handler projection. No suite starts the shared dev stack or runs Gradle.
      - name: Dev-MCP surface (hermetic bootstrap + truth + doc sync)
        run: |
          node scripts/dev/generate-dev-mcp-runtime.mjs --check
          node scripts/dev/generate-dev-mcp-runtime.test.mjs
          node scripts/dev/test-dev-mcp-bootstrap.mjs
          node scripts/dev/test-dev-mcp-observations.mjs
          node scripts/ci/check-dev-mcp-doc-sync.mjs
          node scripts/dev/test-dev-mcp-surface-honesty.mjs
          node scripts/dev/test-dev-mcp-projection-live.mjs
          node scripts/dev/test-ownership-verdict.mjs

      # Tempdoc 913 D1, the same shape a fourth time, one register-family out. The
      # operation-surface gate ran NOWHERE: not in any workflow, not in build.gradle.kts.
      # The self-test step below does exercise it, but only against its fixtures -- it never
      # applies the enforcer to the repo tree, so the enforcer being green says nothing about
      # main being green. #614 typed IndexingController onto the canonical IndexingJobView and
      # landed with the register missing a row for it; PR CI and the merge group both passed
      # and main was red on `--gate operation-surface` from that merge onward.
      #
      # These three are input-free (they read the register JSONs + walk the source tree, no
      # produced artifact), so they cost nothing to run here. Scoped to the register family
      # implicated by D1 rather than "the rest of the kernel": `wire` is environment-sensitive
      # (it needs the buf CLI installed, so it has its own step with that install), so a blanket
      # full-kernel step would land CI red for reasons unrelated to the fix.
      #
      # Census (corrected by review of #617 -- the first count missed the kernel gates the
      # "ui-web pre-merge gate set" step above runs via run-ui-web-gates.mjs, which expands the
      # `ui-web-gates` recipe: ambient-purity, atom-fork-ratchet, modality-contract,
      # transient-arbitration, modal-arbitration). Tempdoc 930 chunk F took the registry from 35
      # gates to 29; the remaining unwired set is tracked in tempdoc 913 open items.
      - name: Register-family gates (operation-surface, execution-surface, guard resolution)
        run: |
          node scripts/governance/run.mjs \
            --gate operation-surface --gate execution-surface --gate register-guard-resolution \
            --mode gate

      # The `wire` gate (protobuf breaking-change detection) ran in NO workflow and no job covers
      # `contracts/**` either, so a breaking .proto change had nothing to stop it.
      #
      # Tempdoc 930 §19.3 F7 removed the assertion that used to follow this step -- a `node -e`
      # grep of the SARIF for `buf-cli-missing`, which existed only because the gate returned
      # verdict `pass` when the CLI was absent. That fail-open is now fixed in the gate itself
      # (`gates/wire/enforcer.mjs`: any `contract-governance/*` runner error fails the gate), so
      # the assertion had nothing left to catch and its absence no longer hides anything.
      #
      # The install stays and is load-bearing: the gate resolves the binary from
      # `scripts/wire-contract/node_modules/@bufbuild/...` by path, NOT from PATH
      # (gates/wire/protobuf-buf-breaking.mjs:22-33 -- the npm .bin launcher is a JS shim that
      # execFileSync cannot run on Windows without shell:true). `bufbuild/buf-setup-action` puts
      # buf on PATH, which this resolver would not see; a 2-package `npm ci` against a committed
      # lockfile (~1s) is both the pinned version and the path the gate actually looks in.
      - name: Wire contract gate (protobuf breaking changes)
        run: |
          npm ci --prefix scripts/wire-contract --audit=false
          node scripts/governance/run.mjs --gate wire --mode gate --out tmp/wire-gate.sarif

      # Tempdoc 884 review B1, same shape as the note above: the kernel's own gate tests
      # (18 *.test.mjs files) ran NOWHERE -- standalone `node <file>` scripts nobody
      # invoked. The runner auto-discovers them so a new one is covered the moment it lands.
      - name: Governance kernel tests (node)
        run: node scripts/governance/run-all-tests.mjs

      # The fixture self-test asserts each gate's positive/negative fixture still produces
      # the verdict it claims. --mode gate is load-bearing: in the default warn mode a
      # mismatch prints and exits 0 (run.mjs:312).
      - name: Governance gate self-test fixtures
        run: node scripts/governance/run.mjs --self-test --mode gate

      - name: ADR premise probes (adr-coverage gate)
        run: node scripts/governance/run.mjs --gate adr-coverage --mode gate

      - name: README benchmark numbers match the canonical release
        run: node scripts/ci/check-readme-benchmark-numbers.mjs

      - name: Release baseline stays in sync with the ratchet + scorecard
        run: node scripts/ci/check-release-baseline-sync.mjs

      - name: Generated scorecard matches the canonical release
        run: node scripts/docs/gen-scorecard.mjs --check

      - name: Outward benchmark numbers cite the canonical release
        run: node scripts/ci/check-outward-number-citations.mjs

      # Tempdoc 835: the shared llama-server argument-rejection predicate. Its previous form was a
      # string literal inside one CI script that silently stopped matching when the bundled build's
      # wording changed — so the reader of the register gets a test, not just a comment.
      - name: Test llama-server argument-rejection predicate
        run: node scripts/ci/lib/llama-server-arg-rejection.test.mjs

      - name: Test deterministic MCPB packer
        run: node scripts/ci/pack-mcpb.test.mjs

      - name: Test MCPB release-bundle consistency gate
        run: node scripts/ci/check-mcpb-consistency.test.mjs

      - name: MCPB source matches server.json.fileSha256 (release integrity + freshness)
        run: node scripts/ci/check-mcpb-consistency.mjs

      - name: Test agent-utility projection lifecycle and drift
        run: node scripts/docs/gen-public-agent-utility.test.mjs

      - name: Test agent-utility publication pointer gate
        run: node scripts/ci/check-public-agent-utility.test.mjs

      - name: Verify agent-utility publication and projections
        run: node scripts/ci/check-public-agent-utility.mjs

      - name: Test the update-preserves-models gate
        run: node scripts/ci/check-update-preserves-models.test.mjs

      # Tempdoc 617 D2 made "an update never touches models" a condition of choosing monolithic
      # full-installer updates, and §7.1 asserts it as fact. Nothing enforced it, so it held only
      # by accident of how the payload happened to be assembled. A monolithic update is
      # uninstall-then-install over a live install, so one recursive delete in an uninstall hook,
      # or one models glob in the bundle, destroys ~9 GB of user assets on first upgrade.
      - name: Update never ships or deletes models
        run: node scripts/ci/check-update-preserves-models.mjs

      # Tempdoc 801 D14.b: the release sequence is the one number that can permanently brick
      # update acceptance (updater.rs refuses anything below the client's persisted
      # highest_accepted_sequence). Its derivation runs exactly once per release cut, inside a
      # manual tag dispatch nothing else exercises — so this offline suite is the only place its
      # max-selection, fail-closed, and floor branches are ever executed.
      - name: Test the release-sequence derivation
        run: node scripts/ci/derive-release-sequence.test.mjs

      - name: Test the installer-branding gate
        run: node scripts/ci/check-installer-branding.test.mjs

      - name: Test the installer execution-level gate
        run: node scripts/ci/check-installer-execution-level.test.mjs

      # Tempdoc 884 §F row 7: this check was invoked by nothing for months. The CONFIG half runs
      # here on every CI run; the ARTIFACT half — the byte-scan that catches an installer-hooks.nsh
      # change leaving tauri.conf.json correct while the BUILT installer still requests elevation —
      # runs in build-installer.yml's installer_verify job, where a setup.exe actually exists.
      - name: Installer does not request elevation (config half)
        run: node scripts/ci/check-installer-execution-level.mjs

      # Three sandbox rounds reported an NSIS wizard naming no version anywhere. Tempdoc 806 routed
      # it through bundle.copyright -> BrandingText; round 13 found that covered only the interior
      # pages, because MUI's Welcome and Finish pages draw no strip (tempdoc 807 R13-F1). Both
      # halves live outside any build the repo can run, so both can regress with every test green.
      - name: Installer wizard names the version it installs
        run: node scripts/ci/check-installer-branding.mjs

      # Sandbox round 9 F1 (BLOCKER): lib.rs registered tauri_plugin_updater unconditionally
      # while plugins.updater lived only in the tag-build overlay, so every non-tag candidate's
      # shell panicked at startup (PluginInitialization, exit 101) before any window or log.
      # The overlay was also missing the serde-required `pubkey`, so the first tag build would
      # have panicked identically. A registered plugin with a required config must have a valid
      # block in the BASE config.
      - name: Registered Tauri plugins have a base config block
        run: node scripts/ci/check-tauri-plugin-config.mjs

      # Round 16 (tempdoc 823/824 F4) hit a 400 from POST /api/ai/install/repair with nowhere to
      # look: the whole /api/ai/install/* family had shipped since alpha without ever appearing in
      # the API contract map. Nothing compared bound routes against documented ones.
      - name: Test the install-API contract-doc gate
        run: node scripts/ci/check-install-api-contract.test.mjs

      - name: Install API routes are documented
        run: node scripts/ci/check-install-api-contract.mjs

      # Tempdoc 837 §5.1: this gate has existed since 600 but no workflow ever invoked it — it lived
      # in the pre-merge table and three tempdocs only. That is how four ORT_CUDA_* reason codes with
      # no producer survived, two of them carrying user-facing wording for a state that cannot occur.
      # A gate nobody runs is prose, not enforcement.
      - name: Test the readiness-reason-codes gate
        run: node scripts/ci/check-readiness-reason-codes.test.mjs

      - name: Readiness reason codes are worded and produced
        run: node scripts/ci/check-readiness-reason-codes.mjs

      # Tempdoc 851 (owner decision 2026-08-19): search-v2 sat DEVELOPER/DEEPLINK for months behind
      # an ACTIVE cutover tempdoc whose parity rows were never checked, and was deleted un-promoted.
      # Nothing made that visible — a window parked "until the cutover" costs nothing to leave
      # parked. This gate keeps the retirement (its directory must stay gone) and puts a dated
      # deadline on the successor's promotion: WARN until 2026-09-30, FAIL after.
      - name: Test the window-cutover gate
        run: node scripts/ci/check-window-cutover.test.mjs

      - name: Retired window stays retired; successor cutover meets its deadline
        run: node scripts/ci/check-window-cutover.mjs

      # The shape-handler live oracle compared eventSchema entries — objects — with `===`, so it
      # reported drift for every shape while printing byte-identical live/fixture lines and could
      # never pass. Only the comparator is unit-testable without a backend, and that is exactly the
      # part that was wrong; the oracle itself still needs a running stack. Tempdoc 930 chunk F
      # split the script: its static `gen-shape-handlers --check` half is now an entry of the
      # regen set, and what is left (this file's subject) is the live-only oracle.
      - name: Test the shape-handler live comparator
        run: node scripts/ci/check-shape-handler-live.test.mjs

      - name: Verify frontend-stack claims
        run: node scripts/docs/check-frontend-stack-claims.mjs

      - name: Verify model-name freshness
        run: node scripts/docs/check-model-freshness.mjs

      - name: Verify privacy claims
        run: node scripts/docs/check-privacy-claims.mjs

      - name: Verify canonical docs links
        run: node scripts/docs/verify-canonical-doc-links.mjs

      - name: Verify module dependency doc is up to date
        run: node scripts/architecture/module-deps.mjs --check-canonical

      - name: Markdownlint canonical docs
        run: npx markdownlint "docs/explanation/**/*.md" "docs/reference/**/*.md" "docs/how-to/**/*.md" "docs/decisions/**/*.md"

      - name: Validate docs frontmatter, headings and encoding
        # Complements markdownlint (style) with the semantic rules: frontmatter parses, the H1
        # equals the frontmatter title llms.txt indexes, no U+FFFD. Unwired until tempdoc 930
        # §22.2 follow-up 7 cleared its last 2,219 findings; wiring it is what keeps it at zero.
        run: node scripts/docs/docs-validate.mjs

      - name: Verify llms.txt is up to date
        run: node scripts/docs/llmstxt-generate.mjs --check

      - name: Verify Claude skill doc sections are up to date
        run: node scripts/docs/skills-sync.mjs --check

      - name: Upload this run's governance-health snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/governance-history.ndjson
          if-no-files-found: warn

  jseval-suite:
    name: jseval Python suite
    # tempdoc 930 §18.1 row 7. `scripts/jseval/tests/` is ~47k lines that ran in CI
    # NOWHERE — a measurement harness behind public claims whose own tests were a claim
    # rather than a guarantee. The suite is pure-CPU and fully mocked (nothing here
    # starts a backend, and `run.py`'s three socket-opening helpers are stubbed by
    # `tests/test_run.py::_offline_backend`), so it runs on a hosted Linux runner.
    #
    # Optional-dependency behaviour: `inspect_ai` (agent extra), `playwright` (ui extra)
    # and `Pillow` (scan extra) are reached only through `pytest.importorskip`, so those
    # tests SKIP rather than error and the ~80 transitive deps of the agent extra stay out
    # of this lane. That guard was MISSING in four places — the three modules importing
    # `jseval.agent_utility_inspect` at module scope (`test_agent_behavioral_789.py`,
    # `test_delivery_tier_735.py`, `test_partial_usage_capture_757.py`) and the
    # `_graded_logs` helper in `test_utility_comparison.py` — and was added to match
    # their already-guarded siblings. The first run of this job caught the module-scope
    # three as `Interrupted: 3 errors during collection`, which aborted the WHOLE suite.
    # All four went unnoticed precisely because nothing ran the suite on a machine
    # without the agent extra installed. `hypothesis` and `jsonschema` are NOT guarded
    # (`tests/test_suite_stats_properties.py:10`), which is why the `dev` extra is
    # installed in full below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        # Only for the lock-drift guard below; no npm install happens in this job.
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: jseval dependency lock drift guard
        # Same fail-fast as the claims lane: if pyproject.toml and the committed lock
        # disagree, the install below would resolve versions nobody reviewed.
        run: node scripts/ci/check-jseval-lock.mjs

      - name: Install canonical jseval
        # Mirrors the claims lane's install: constraint-installed against the dependency
        # lock (tempdoc 792 §6) so the suite resolves the same versions every run.
        run: python -m pip install -e scripts/jseval -c scripts/jseval/requirements.lock.txt

      - name: Install test dependencies
        # The `dev` extra's four packages are absent from requirements.lock.txt, so `-c`
        # leaves them unpinned and installing them through the canonical command above
        # would trip the lock-drift guard. Named explicitly (rather than `[dev]`) so this
        # step's resolution set is visible in the diff.
        run: python -m pip install --quiet "pytest>=7.0" "pyyaml>=6.0" "hypothesis>=6.0" "jsonschema>=4.0"

      - name: Run jseval test suite
        # `-p no:cacheprovider`: a fresh runner has no cache to reuse and the plugin
        # would only write .pytest_cache into the checkout.
        run: python -m pytest scripts/jseval/tests -q -p no:cacheprovider

  measured-axe:
    name: Measured axe (advisory)
    # Tempdoc 930 §22.2 follow-up 5. Chunk H retired twelve static a11y/token oracles in
    # favour of measurement, but only half the replacement ran on PRs: the four-palette
    # contrast sweep (`check-contrast-matrix`, inside the required `Public claims` lane via
    # run-ui-web-gates.mjs). The other half — `jseval ui-a11y-gate`, real axe-core against
    # the rendered page — was local-only, so a PR that regressed a rendered-page a11y rule
    # had no automated catch at all.
    #
    # Nothing about that gate needs the backend, which is why it can run here: `--fixtures`
    # intercepts every `/api/*` request in Playwright and serves committed schema-valid
    # bodies (scripts/jseval/jseval/ui_fixtures.py `install_fixtures`), and `ui-shot` starts
    # its own Vite dev server out of `modules/ui-web` (ui_shot.py `_start_vite_server`). So
    # the whole sweep is Node + Python + headless Chromium: no Java, no Gradle, no GPU, no
    # dev stack. Measured locally at 350s wall for the register's 20 surfaces including a
    # cold Vite start, exit 0.
    #
    # ADVISORY, following `integration-tests`: deliberately absent from
    # scripts/ci/workflow-signal-policy.v1.json's requiredStatusChecks and from
    # scripts/ci/public-ci-local-repro.v1.json (adding an entry to the latter while the job
    # is not a required check FAILS validatePublicCiLocalRepro by design). Promotion to a
    # required check is a separate decision that wants stability evidence from this lane
    # first — the path `jseval-suite` walked between §18.1 row 7 and §22.2 follow-up 4.
    # Recorded as the 2026-09-05 amendment to ADR-0026, which is why the gate's own
    # docstrings no longer say "not CI-wired". Also absent from
    # scripts/ci/ci-walltime-policy.v1.json: every lane there carries a `requiredCheck`
    # and the reporter's one loud finding is `missing-required-lane`, so a non-required
    # job has no honest row to occupy until it is promoted.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: modules/ui-web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: jseval dependency lock drift guard
        run: node scripts/ci/check-jseval-lock.mjs

      - name: Install canonical jseval with the ui extra
        # The `ui` extra is Playwright. It is an optional-dependency, so it is absent from
        # requirements.lock.txt and `-c` leaves it unpinned — same shape as the pytest
        # install in the two lanes above. The lock-drift guard only compares pyproject's
        # base `dependencies` against the lock, so naming an extra here cannot trip it.
        run: python -m pip install -e "scripts/jseval[ui]" -c scripts/jseval/requirements.lock.txt

      - name: Install frontend dependencies
        # axe.min.js (the bundle ui_measure injects) and Vite both come from here.
        run: npm ci --prefix modules/ui-web --audit=false

      - name: Resolve the installed Playwright version
        id: playwright
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install headless Chromium
        # `--with-deps` installs the shared libraries Chromium needs; those are apt packages,
        # not part of the cached browser directory, so this step runs on a cache hit too.
        run: python -m playwright install --with-deps chromium

      - name: Measured axe over the a11y baseline register
        # Exit 0 clean · 1 a NEW axe rule not in the surface's `knownRules` · 2 a capture
        # error. The per-surface verdict JSON goes to stderr; `pipefail` keeps the gate's
        # exit code rather than tee's (agent-lessons `piped-exit-masked`).
        run: |
          set -o pipefail
          mkdir -p build/ci/ui-a11y
          python -m jseval ui-a11y-gate --output-dir build/ci/ui-a11y 2>&1 \
            | tee build/ci/ui-a11y/gate-report.log

      - name: Upload measured-axe captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measured-axe-captures
          path: |
            build/ci/ui-a11y/*.measure.json
            build/ci/ui-a11y/*.png
            build/ci/ui-a11y/gate-report.log
          if-no-files-found: warn

  license-and-notices:
    name: License and notices
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      # Gradle caching is owned by setup-gradle, not by setup-java's `cache: gradle`
      # (tempdoc 829 R2+R7). On Windows lanes the Gradle daemon is still alive at
      # post-job save time and holds mandatory locks on ~/.gradle/caches/**/*.lock, so
      # the cache tar exited 2 (EBUSY) and the cache was NEVER saved — every Windows
      # run was a cold cache (actions/setup-java#633, workaround-only upstream).
      # setup-gradle stops daemons in its own post-action and defaults to
      # cache-read-only off the default branch, so only `main` writes entries (R7).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: modules/ui-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix modules/ui-web --audit=false

      - name: Enforce the license allowlist
        run: ./gradlew.bat checkLicense --no-configuration-cache --no-parallel

      - name: Dump Rust/Cargo licenses for the NOTICE projection
        run: node scripts/codegen/dump-cargo-licenses.mjs

      - name: Dump frontend npm licenses for the NOTICE projection
        shell: cmd
        run: |
          cd modules\ui-web
          npx --yes license-checker --production --json --relativeOnly > ..\..\build\npm-licenses.json

      # The one regen-set entry that needs produced inputs (the license reports dumped above), so
      # it runs here rather than in the hermetic regen step in `Public claims`. Tempdoc 930 chunk F.
      - name: NOTICE / THIRD_PARTY_NOTICES are in sync
        run: node scripts/ci/regen-all.mjs --check --only notices

  build:
    name: Build (no model blobs)
    # Migrated to Linux (tempdoc 668) — assemble is compile + web-bundle, no tests,
    # so no Windows-test portability tail; protoc already fixed for Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/ui-web/package-lock.json
            packages/runtime-client/package-lock.json

      - name: Install root dependencies
        run: npm ci --audit=false

      - name: Install runtime client generator dependencies
        run: npm ci --prefix packages/runtime-client --ignore-scripts --audit=false

      - name: Runtime client generated source is in sync
        run: npm --prefix packages/runtime-client run check:regen

      - name: Assemble without model blobs
        shell: bash
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          node scripts/ci/report-build-attribution.mjs --runner-label "ubuntu-latest" --out-json build/ci/build-attribution.json --out-md build/ci/build-attribution.md --task-timing-json build/ci/build-task-timing.json -- ./gradlew assemble -PskipWebBuild=false --console=plain

      # PMD rides this job because it needs compiled classes and nothing else, and this job has
      # already compiled main via `assemble`. Tempdoc 930 §22.2 follow-up 2 — before this step no
      # workflow put PMD in its task graph, so the ruleset (incl. the `CommentContent` parked-marker
      # ban) never ran in CI. It is a separate step, not an `assemble` dependency: `assemble`
      # produces artifacts, `check` verifies them, and PMD is verification.
      #
      # `pmdAll` (root build.gradle.kts), not a list of task names: it is every `Pmd` task in every
      # module, so a module that registers a new `JvmTestSuite` is covered without anyone
      # remembering — the same dormancy shape follow-up 2 found in `pmdMain` and follow-up 10 found
      # in `modules/system-tests`.
      #
      # PLACEMENT IS MEASURED, NOT ASSUMED. Follow-up 10 widened the step from `pmdMain` (49s) to
      # every source set (188s here) and it was tried in `Unit tests (platform-contracts)` on the
      # theory that a lane already compiling test sources would run it cheaper. It did not: 201s
      # there, and that lane hit 488s against its 360s advisory budget, while this job runs 469s
      # against 600s. `pmdAll` needs main plus every non-main source set for all ~30 modules, so
      # neither placement avoids the compile — this is the job with the headroom. Do not relocate
      # again without re-measuring; `scripts/ci/ci-walltime-policy.v1.json` holds both numbers.
      - name: Static analysis (PMD, all source sets)
        run: ./gradlew pmdAll --console=plain

      # `gen-api-client --check` is an entry of the regen set (run in `Public claims`); the
      # classified OpenAPI snapshot's check shells out to Gradle, so it stays its own step and
      # belongs in this job, which has already assembled. Tempdoc 930 chunk F.
      - name: Reference-client OpenAPI projection is reproducible
        run: node scripts/ci/check-reference-client-openapi-regen.mjs

      - name: Upload build attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-attribution
          path: |
            build/ci/build-attribution.json
            build/ci/build-attribution.md
            build/ci/build-task-timing.json
          if-no-files-found: warn

      - name: Setup runtime client minimum Node version
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Test and inspect the packed runtime client
        run: |
          npm --prefix packages/runtime-client test
          npm --prefix packages/runtime-client run check:pack

  unit-tests:
    name: Unit tests (${{ matrix.lane }})
    # Per-lane runner OS (tempdoc 668 option B). app-ui is migrated to Linux (~2.8x
    # faster, validated); its Windows-specific tests are @Tag("windows") and run on
    # the separate windows-native-tests lane. search-worker / platform-contracts stay
    # on Windows pending their own Linux validation.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: app-ui
            os: ubuntu-latest
            artifact: unit-test-attribution-app-ui
            runner_label: ubuntu-latest/app-ui
            fetch_depth: 1
            # This lane runs :modules:app-services:test, which IS RegistrySnapshotExporterTest --
            # the producer of tmp/consumer-presence/registry-snapshot.json. The three gates that
            # read that snapshot therefore run here (tempdoc 918 B1), same pattern as
            # run_snapshot_gates, but for the app-ui lane. None of the three resolves a git
            # baseline (registry: diffStrategy "none" / no baseline), so depth 1 is enough.
            run_snapshot_gates: "true"
            gradle_tasks: >-
              :modules:app-agent:test
              :modules:app-agent-api:test
              :modules:app-api:test
              :modules:app-api-tck:test
              :modules:app-config:test
              :modules:app-launcher:test
              :modules:app-observability:test
              :modules:app-services:test
              :modules:app-util:test
              :modules:ui:test
          - lane: search-worker
            os: ubuntu-latest
            artifact: unit-test-attribution-search-worker
            runner_label: ubuntu-latest/search-worker
            fetch_depth: 1
            gradle_tasks: >-
              :modules:adapters-lucene:test
              :modules:configuration:test
              :modules:core:test
              :modules:core-contracts:test
              :modules:indexer-worker:test
              :modules:indexing:test
              :modules:ipc-common:test
              :modules:worker-core:test
              :modules:worker-services:test
          - lane: platform-contracts
            os: ubuntu-latest
            artifact: unit-test-attribution-platform-contracts
            runner_label: ubuntu-latest/platform-contracts
            # :modules:dead-code-audit:test carries the whole-program dead-class ratchet as an
            # ArchUnit FreezingArchRule (tempdoc 930 chunk F retired the `dead-code-jvm` kernel
            # gate that used to read its JSON report from a separate step). The store is a
            # checked-in file, not a git-base diff, so this lane no longer needs full history for
            # THAT reason -- but the depth stays 0 until something measures that nothing else in
            # the lane wants history, because a silent shallow-clone regression is exactly the
            # class the checkout comment below is about.
            fetch_depth: 0
            gradle_tasks: >-
              :modules:ai-backend:test
              :modules:api-contract-projection-java:test
              :modules:app-inference:test
              :modules:benchmarks:test
              :modules:dead-code-audit:test
              :modules:extension-substrate:test
              :modules:gpu-bridge:test
              :modules:infra-core:test
              :modules:ort-common:test
              :modules:prompt-support:test
              :modules:reranker:test
              :modules:ssot-tools:test
              :modules:system-tests:test
              :modules:telemetry:test
              :modules:test-support:test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # platform-contracts alone takes real history (see its matrix comment). The other two
          # lanes stay on depth 1.
          #
          # Every lane declares this explicitly. `matrix.fetch_depth || 1` would have been wrong:
          # GitHub expressions treat 0 as FALSY, so the one lane that needs full history would have
          # silently got depth 1 and the gate would have exited 2 on every run.
          fetch-depth: ${{ matrix.fetch_depth }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests with model-dependent tests self-skipping
        id: gradle-test
        shell: bash
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          GW='./gradlew'; [ "$RUNNER_OS" = "Windows" ] && GW='./gradlew.bat'
          "$GW" ${{ matrix.gradle_tasks }} -PskipWebBuild=true --console=plain

      # Tempdoc 918 B1. consumer-presence, host-owns-truth and runtime-witness read the registry
      # snapshot exported below, and each returns verdict `pass` with a `snapshot-missing` WARNING
      # when it is absent -- a soft-fail that makes them vacuous anywhere else. The dedicated
      # exporter must run explicitly because a cached Gradle test task does not replay its
      # filesystem side effect. The final line is the anti-vacuous assertion: if the snapshot was
      # not built, the finding is present and this step fails rather than reporting a green that
      # inspected nothing.
      - name: Registry-snapshot gates (fresh explicit input)
        if: matrix.run_snapshot_gates == 'true'
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          GW='./gradlew'; [ "$RUNNER_OS" = "Windows" ] && GW='./gradlew.bat'
          "$GW" :modules:app-services:exportRegistrySnapshot -PskipWebBuild=true --console=plain
          node scripts/governance/run.mjs             --gate consumer-presence --gate host-owns-truth --gate runtime-witness             --mode gate --out tmp/snapshot-gates.sarif
          node -e "if (require('fs').readFileSync('tmp/snapshot-gates.sarif','utf8').includes('snapshot-missing')) { console.error('registry snapshot absent: these three gates inspected nothing'); process.exit(1); }"

      - name: Report unit-test attribution
        if: always()
        run: node scripts/ci/report-unit-test-attribution.mjs --lane "${{ matrix.lane }}" --runner-label "${{ matrix.runner_label }}" --out-json build/ci/unit-test-attribution.json --out-md build/ci/unit-test-attribution.md --top 20 --allow-empty

      - name: Report unit-test advisory budget
        if: always()
        run: node scripts/ci/report-unit-test-budget.mjs --lane "${{ matrix.lane }}" --attribution build/ci/unit-test-attribution.json --out-json build/ci/unit-test-budget.json --out-md build/ci/unit-test-budget.md

      - name: Upload unit-test attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/ci/unit-test-attribution.json
            build/ci/unit-test-attribution.md
            build/ci/unit-test-budget.json
            build/ci/unit-test-budget.md
            modules/**/build/test-results/test/TEST-*.xml
          if-no-files-found: warn

  # Tempdoc 668 option B — runs ONLY the @Tag("windows") tests (single-instance lock,
  # job objects, power status) on Windows, preserving coverage of genuinely Windows-
  # specific product behaviour that the Linux-migrated lanes (app-ui) skip. Small + fast
  # (a handful of classes via -PwindowsOnly). Covers the modules moved to Linux so far.
  windows-native-tests:
    name: Windows-native tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Evidence capture exits cleanly after Windows fetch teardown
        run: node --test scripts/release/evidence-capture-exit.test.mjs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Windows-only tests (@Tag windows) for the Linux-migrated modules
        run: ./gradlew.bat :modules:app-util:test :modules:app-agent:test :modules:app-services:test :modules:adapters-lucene:test :modules:app-inference:test -PwindowsOnly=true --console=plain

      - name: Release signing contract tests
        shell: pwsh
        run: |
          ./scripts/ci/test-install-codesign-tool.ps1
          ./scripts/ci/test-resolve-release-signing.ps1
          ./scripts/ci/test-sign-windows.ps1
          ./scripts/ci/test-verify-pe-signatures.ps1
          ./scripts/release/test-sign-vendored-payload.ps1

  # The `shell` crate ran in NO lane until now. The only `cargo` invocation anywhere in CI was
  # `dump-cargo-licenses.mjs` (this file, "License and notices"), which compiles nothing. So
  # `modules/shell/src-tauri/src/updater.rs` — the durable upgrade-intent state machine,
  # shutdown-receipt validation, installer-launch witness, and restart reconciliation — had its
  # unit tests run only on an author's machine and cited as implementation evidence, with nothing
  # re-running them. A regression there lands in the one code path whose failure mode is a
  # bricked user install.
  #
  # Not hypothetical: this lane was added while fixing a defect it would have caught — restart
  # reconciliation validated the Head shutdown receipt against the receipt's *own* PID field,
  # making the check tautological on exactly the path where the live process witness is gone
  # (tempdoc 617). The regression test now lives beside it.
  #
  # Windows, not ubuntu: the crate is Windows-specific (ShellExecuteExW installer handoff,
  # webview2, NSIS hooks). It has never been built on Linux; moving it there is a separate
  # exercise with its own evidence, not an assumption to make here.
  #
  # The placeholder step: tauri.conf.json bundles `resources/headless/**/*`, which is produced by
  # `:modules:ui:bundleSidecarResources` (a jlink runtime image plus jars, several minutes), and
  # tauri_build fails the build script outright when that glob matches nothing. Without the
  # placeholder, a pure-logic unit-test lane would have to build the entire sidecar payload to
  # compile. The directory is gitignored and packaging is unaffected: build-installer.yml stages
  # the real bundle before it packages anything.
  shell-rust-tests:
    name: Shell crate tests (Rust)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/shell/src-tauri

      - name: Stage bundle-resource placeholder
        shell: pwsh
        run: |
          $dir = 'modules/shell/src-tauri/resources/headless'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path "$dir/.ci-placeholder" -Encoding utf8 `
            -Value 'Resolves the tauri bundle resource glob for the unit-test lane. Not a payload.'

      - name: Cargo test
        working-directory: modules/shell/src-tauri
        run: cargo test --lib --locked

  # `:modules:system-tests:integrationTest` ran in NO lane until now: ci.yml ran only
  # `:modules:system-tests:test`, and the module's `check` depends on `test` alone
  # (modules/system-tests/build.gradle.kts:297). The tier rotted unobserved as a result —
  # every IsolatedBackendFixture class was failing at @BeforeAll with
  # `ClassNotFoundException: io.justsearch.ui.HeadlessApp` and nobody noticed, because
  # nothing ran it. This job closes that blind spot.
  #
  # Own job, not folded into windows-native-tests: that lane is deliberately "@Tag(windows)
  # only, small + fast", and this file's header requires each job be named after the fact it
  # proves rather than becoming "one opaque Windows bucket".
  #
  # Windows, not ubuntu: the tier spawns a real Head child JVM (HeadlessApp), which in turn
  # spawns the Worker from `:modules:indexer-worker:installDist` — process spawn, argfile
  # classpath quoting, and worker-lib path resolution are exactly the surfaces that differ per
  # OS, and Windows is the OS the product ships on. The tier has never been validated on Linux;
  # moving it there is a separate exercise with its own evidence, not an assumption to make here.
  #
  # ADVISORY (continue-on-error + deliberately absent from workflow-signal-policy.v1.json's
  # requiredStatusChecks, same pattern as `ci-walltime`): the HeadlessApp classpath rot above is
  # still open on `main`, so a blocking lane would red-wall every PR on a known, unrelated
  # failure. Advisory already closes the blind spot the tier had — it now runs on every PR and
  # its results are visible and archived, so rot cannot be silent again. Flip
  # `continue-on-error` off and add "Integration tests (system-tests tier)" to
  # requiredStatusChecks once the tier is green.
  integration-tests:
    name: Integration tests (system-tests tier)
    runs-on: windows-latest
    # Must stay above the Gradle task timeout (modules/system-tests/build.gradle.kts, 30 min),
    # or the job is killed first and the artifact-upload step below never runs. 30 min + the
    # measured 1m26s of checkout/setup/post steps (run 31716264505) leaves ~3.5 min of margin.
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # No model blobs on a public checkout, so the model-dependent cases self-skip via their
      # own assumeTrue guards; the Golden Corpus cases use frozen vectors and need no model.
      - name: Integration tier (Golden Corpus, relevance, isolated-backend E2E)
        run: ./gradlew.bat :modules:system-tests:integrationTest -PskipWebBuild=true --console=plain

      # PR #447 review fix: R3 (failOnPassedAfterRetry=false for this advisory lane, above in
      # modules/system-tests/build.gradle.kts) keeps a self-recovered boot flake from reddening
      # this job, but that alone drops ALL automated surfacing of the flake class — it would
      # only be visible via manual log/XML archaeology in the uploaded artifact below. This step
      # closes that gap the same way the unit-tests matrix already does (R5, same PR): extract
      # flakyTests from the just-produced JUnit XML into an attribution report. No budget step
      # here deliberately — report-unit-test-budget.mjs throws when a lane isn't declared in
      # unit-test-shard-policy.v1.json, and integration-tests isn't a unit-test shard.
      - name: Report integration-test attribution
        if: always()
        run: node scripts/ci/report-unit-test-attribution.mjs --lane integration-tests --runner-label windows-latest --out-json build/ci/integration-test-attribution.json --out-md build/ci/integration-test-attribution.md --top 20 --allow-empty

      - name: Upload integration-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            modules/system-tests/build/test-results/integrationTest/TEST-*.xml
            modules/system-tests/build/reports/tests/integrationTest/**
            modules/system-tests/build/reports/isolated-backend/**
            build/ci/integration-test-attribution.json
            build/ci/integration-test-attribution.md
          if-no-files-found: warn

  # Runs the MIT-licensed gitleaks CLI directly instead of gitleaks/gitleaks-action.
  # The action is a wrapper that (a) demands a paid GITLEAKS_LICENSE secret as soon as
  # the repository owner is an organization — with no public-repo exemption — and
  # (b) hard-exits on any event outside push/pull_request/workflow_dispatch/schedule,
  # which includes merge_group. Both would turn this REQUIRED check red the day the
  # repo moves to an org and a merge queue is enabled. The CLI has neither limit.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pin the release and verify its checksum: the binary is fetched from a
      # third-party release page into a job that reads the whole repository.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks CLI
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # `dir` scans the checked-out tree rather than a commit range. Every PR lands on
      # main as a single squashed commit (ADR-0045), so the tree that this job scans is
      # exactly the content that would land — and main's history stays clean by
      # induction. The binary and its archive live in RUNNER_TEMP so they are not
      # themselves scanned. Any finding exits non-zero and fails this required check.
      - name: Gitleaks
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path "${RUNNER_TEMP}/gitleaks-results.sarif"

      - name: Upload gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: warn

  # Advisory only — NOT a required check (see workflow-signal-policy.v1.json
  # requiredStatusChecks; do not add this job's name there). Runs after every
  # lane so it can read all sibling job/step timings and attribute the run's
  # wall-clock: which lane is the critical path, and how much of each lane is
  # fixed runner tax vs work. Warn-only budget; never fails the run. Tempdoc 668.
  ci-walltime:
    name: CI wall-clock attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `jseval-suite` is in this list because it is a required lane with a wall-clock
    # budget: `report-ci-walltime-attribution.mjs` drops any job with no end time, so an
    # attribution taken while the ~6.5-minute suite still runs would omit it entirely and
    # `report-ci-walltime-budget.mjs` would warn `missing-required-lane` on every run.
    needs: [public-claims, license-and-notices, build, unit-tests, windows-native-tests, shell-rust-tests, integration-tests, secret-scan, jseval-suite]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch this run's job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --paginate > build/ci/run-jobs.json

      # Same-run cross-job download (needs no extra permission; the unit lanes are
      # in `needs`). Lets the attribution split each unit lane's opaque test step
      # into test CPU vs framework overhead. continue-on-error so a cancelled lane
      # (no artifact) degrades to "no breakdown" instead of failing this advisory job.
      - name: Download unit-test attributions (for the test-vs-overhead split)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: unit-test-attribution-*
          path: build/ci/unit-artifacts

      - name: Report wall-clock attribution
        run: node scripts/ci/report-ci-walltime-attribution.mjs --jobs-json build/ci/run-jobs.json --unit-attribution-dir build/ci/unit-artifacts --run-id "${{ github.run_id }}" --repository "${{ github.repository }}" --workflow "${{ github.workflow }}" --self-job "CI wall-clock attribution" --out-json build/ci/ci-walltime-attribution.json --out-md build/ci/ci-walltime-attribution.md

      - name: Report wall-clock advisory budget
        run: node scripts/ci/report-ci-walltime-budget.mjs --attribution build/ci/ci-walltime-attribution.json --out-json build/ci/ci-walltime-budget.json --out-md build/ci/ci-walltime-budget.md

      - name: Upload wall-clock attribution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-walltime-attribution
          path: |
            build/ci/ci-walltime-attribution.json
            build/ci/ci-walltime-attribution.md
            build/ci/ci-walltime-budget.json
            build/ci/ci-walltime-budget.md
          if-no-files-found: warn
