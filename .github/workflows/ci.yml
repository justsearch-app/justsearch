name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      cp_mode:
        type: choice
        default: test-failure
        options: [test-failure, setup-failure, timeout, skip, cancel]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true
jobs:
  app-ui-ui:
    name: Unit tests (app-ui-ui)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.cp_mode || 'test-failure') == 'timeout' && 1 || 5 }}
    env:
      CP_MODE: ${{ inputs.cp_mode || 'test-failure' }}
      CP_TARGET: "false"
      CP_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Fixture setup (forced setup failure when selected)
        shell: bash
        run: |
          mkdir -p build/ci
          printf 'scheduler fixture app-ui-ui, attempt %s, mode %s\n' "$CP_ATTEMPT" "$CP_MODE" > build/ci/fixture.log
          if [ "$CP_TARGET" = true ] && [ "$CP_MODE" = setup-failure ]; then exit 1; fi
      - name: Fixture test (forced test failure, timeout or cancellation when selected)
        shell: bash
        run: |
          if [ "$CP_TARGET" = true ]; then
            case "$CP_MODE" in
              test-failure) if [ "$CP_ATTEMPT" = 1 ]; then exit 1; fi ;;
              timeout) sleep 120 ;;
              cancel) sleep 300 ;;
            esac
          fi
      - name: Preserve fixture evidence (not product-test evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-attribution-app-ui-ui-attempt-${{ github.run_attempt }}
          path: build/ci/fixture.log
          if-no-files-found: warn
  app-ui-services:
    name: Unit tests (app-ui-services)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.cp_mode || 'test-failure') == 'timeout' && 1 || 5 }}
    env:
      CP_MODE: ${{ inputs.cp_mode || 'test-failure' }}
      CP_TARGET: "false"
      CP_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Fixture setup (forced setup failure when selected)
        shell: bash
        run: |
          mkdir -p build/ci
          printf 'scheduler fixture app-ui-services, attempt %s, mode %s\n' "$CP_ATTEMPT" "$CP_MODE" > build/ci/fixture.log
          if [ "$CP_TARGET" = true ] && [ "$CP_MODE" = setup-failure ]; then exit 1; fi
      - name: Fixture test (forced test failure, timeout or cancellation when selected)
        shell: bash
        run: |
          if [ "$CP_TARGET" = true ]; then
            case "$CP_MODE" in
              test-failure) if [ "$CP_ATTEMPT" = 1 ]; then exit 1; fi ;;
              timeout) sleep 120 ;;
              cancel) sleep 300 ;;
            esac
          fi
      - name: Preserve fixture evidence (not product-test evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-attribution-app-ui-services-attempt-${{ github.run_attempt }}
          path: build/ci/fixture.log
          if-no-files-found: warn
  windows-native-node:
    name: Windows-native tests (node)
    if: ${{ (inputs.cp_mode || 'test-failure') != 'skip' }}
    runs-on: windows-latest
    timeout-minutes: ${{ (inputs.cp_mode || 'test-failure') == 'timeout' && 1 || 5 }}
    env:
      CP_MODE: ${{ inputs.cp_mode || 'test-failure' }}
      CP_TARGET: "true"
      CP_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Fixture setup (forced setup failure when selected)
        shell: bash
        run: |
          mkdir -p build/ci
          printf 'scheduler fixture windows-native-node, attempt %s, mode %s\n' "$CP_ATTEMPT" "$CP_MODE" > build/ci/fixture.log
          if [ "$CP_TARGET" = true ] && [ "$CP_MODE" = setup-failure ]; then exit 1; fi
      - name: Fixture test (forced test failure, timeout or cancellation when selected)
        shell: bash
        run: |
          if [ "$CP_TARGET" = true ]; then
            case "$CP_MODE" in
              test-failure) if [ "$CP_ATTEMPT" = 1 ]; then exit 1; fi ;;
              timeout) sleep 120 ;;
              cancel) sleep 300 ;;
            esac
          fi
      - name: Preserve fixture evidence (not product-test evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-node-attempt-${{ github.run_attempt }}
          path: build/ci/fixture.log
          if-no-files-found: warn
  windows-native-contracts:
    name: Windows-native tests (contracts)
    runs-on: windows-latest
    timeout-minutes: ${{ (inputs.cp_mode || 'test-failure') == 'timeout' && 1 || 5 }}
    env:
      CP_MODE: ${{ inputs.cp_mode || 'test-failure' }}
      CP_TARGET: "false"
      CP_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Fixture setup (forced setup failure when selected)
        shell: bash
        run: |
          mkdir -p build/ci
          printf 'scheduler fixture windows-native-contracts, attempt %s, mode %s\n' "$CP_ATTEMPT" "$CP_MODE" > build/ci/fixture.log
          if [ "$CP_TARGET" = true ] && [ "$CP_MODE" = setup-failure ]; then exit 1; fi
      - name: Fixture test (forced test failure, timeout or cancellation when selected)
        shell: bash
        run: |
          if [ "$CP_TARGET" = true ]; then
            case "$CP_MODE" in
              test-failure) if [ "$CP_ATTEMPT" = 1 ]; then exit 1; fi ;;
              timeout) sleep 120 ;;
              cancel) sleep 300 ;;
            esac
          fi
      - name: Preserve fixture evidence (not product-test evidence)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-contracts-attempt-${{ github.run_attempt }}
          path: build/ci/fixture.log
          if-no-files-found: warn
  app-ui:
    name: Unit tests (app-ui)
    needs: [app-ui-ui, app-ui-services]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every app-ui part to succeed
        env:
          UI_RESULT: ${{ needs.app-ui-ui.result }}
          SERVICES_RESULT: ${{ needs.app-ui-services.result }}
        run: test "$UI_RESULT" = success && test "$SERVICES_RESULT" = success

  windows-native-tests:
    name: Windows-native tests
    needs: [windows-native-node, windows-native-contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Windows-native part to succeed
        env:
          NODE_RESULT: ${{ needs.windows-native-node.result }}
          CONTRACTS_RESULT: ${{ needs.windows-native-contracts.result }}
        run: test "$NODE_RESULT" = success && test "$CONTRACTS_RESULT" = success

  # The `shell` crate ran in NO lane until now. The only `cargo` invocation anywhere in CI was
  # `dump-cargo-licenses.mjs` (this file, "License and notices"), which compiles nothing. So
  # `modules/shell/src-tauri/src/updater.rs` — the durable upgrade-intent state machine,
  # shutdown-receipt validation, installer-launch witness, and restart reconciliation — had its
  # unit tests run only on an author's machine and cited as implementation evidence, with nothing
  # re-running them. A regression there lands in the one code path whose failure mode is a
  # bricked user install.
  #
  # Not hypothetical: this lane was added while fixing a defect it would have caught — restart
  # reconciliation validated the Head shutdown receipt against the receipt's *own* PID field,
  # making the check tautological on exactly the path where the live process witness is gone
  # (tempdoc 617). The regression test now lives beside it.
  #
  # Windows, not ubuntu: the crate is Windows-specific (ShellExecuteExW installer handoff,
  # webview2, NSIS hooks). It has never been built on Linux; moving it there is a separate
  # exercise with its own evidence, not an assumption to make here.
  #
  # The placeholder step: tauri.conf.json bundles `resources/headless/**/*`, which is produced by
  # `:modules:ui:bundleSidecarResources` (a jlink runtime image plus jars, several minutes), and
  # tauri_build fails the build script outright when that glob matches nothing. Without the
  # placeholder, a pure-logic unit-test lane would have to build the entire sidecar payload to
  # compile. The directory is gitignored and packaging is unaffected: build-installer.yml stages
  # the real bundle before it packages anything.
