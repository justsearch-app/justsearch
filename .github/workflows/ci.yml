name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verifier-windows:
    name: Independent Windows discovery verification
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - run: npm ci --audit=false
      - name: Discovery suite and deliberate failure cases
        timeout-minutes: 5
        run: node scripts/ci/verify-discovery-windows-sdk.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-discovery-verifier
          path: verification-output/
