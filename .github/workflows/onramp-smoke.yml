# Tempdoc 656 — the onramp's continuous proof-lane.
#
# Runs the runnable first-success proof (scripts/dev/test-onramp-first-success.mjs) on a clean
# public-hosted runner with NO models and NO GPU, so it exercises the model-less **Tier 0** path:
# start the stack -> index the bundled demo corpus -> a keyword query returns a real result.
# This continuously proves the onramp's headline promise (zero-download first success) still works.
#
# Manual (workflow_dispatch) + advisory/non-blocking, matching the repo's "specialty workflows remain
# manual; local-first primary" policy (ADR-0044 / CLAUDE.md). Declared in
# scripts/ci/workflow-signal-policy.v1.json as class "scheduled-quality-signal".
name: Onramp Smoke

on:
  workflow_dispatch: # Manual trigger — heavy (starts the full dev stack); not a per-PR gate.

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"
  JAVA_VERSION: "25"

jobs:
  onramp-tier0-smoke:
    name: Onramp first-success (Tier 0, model-less)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The dev stack spawns the Vite frontend (readiness gates on the backend only, but install its
      # deps so the spawn is clean — mirrors the proven local run).
      - name: Install frontend deps
        working-directory: modules/ui-web
        run: npm ci

      # Pre-build so the smoke's stack-start budget isn't spent on a cold, from-scratch Gradle build.
      # `dev-runner start` runs `assemble -PskipWebBuild=true` (dev-runner.cjs:1010-1013) as its
      # up-to-date gate; run that EXACT task+flag here so its later check is UP-TO-DATE (~seconds)
      # instead of a cold whole-project compile INSIDE startStack's 240s window
      # (stage-reference-corpus.mjs:34). NOTE: `assemble` covers ALL modules — installDist of just
      # ui+worker (the first fix attempt) left benchmarks/test-support to recompile, which still blew
      # the 240s budget (run 28905787720). Keep the whole-project `assemble` here, plus installDist for
      # the launch dir (dev-runner.cjs:1037 fail-fasts without it). Without any of this, the lane fails
      # at "FAIL stack start timed out" (the original 2026-07-02 run 28607534344).
      - name: Build (assemble + installDist — keeps stack-start off the cold-build path)
        run: ./gradlew.bat assemble :modules:ui:installDist :modules:indexer-worker:installDist -PskipWebBuild=true

      # Force the model-less Tier 0 path deterministically (independent of whether models/ exists).
      - name: Prepare empty models dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\empty-models" | Out-Null

      # Fast, model-less anti-regression: dev inference resolution must NEVER fall back to a CPU
      # baseline (tempdoc 656 Move 1/2). No stack, no models needed — runs before the heavier smoke.
      - name: Dev-runner runtime resolution regression test
        run: npm run test:dev-runner

      - name: Onramp doctor (diagnostic — reports the tier)
        continue-on-error: true
        env:
          JUSTSEARCH_MODELS_DIR: ${{ runner.temp }}\empty-models
        run: node scripts/dev/doctor.mjs

      # The proof: start stack -> ingest examples/onramp-corpus -> query -> assert a first result.
      # Self-tears-down. Asserts Tier 0 unconditionally; the Tier-1 check is skipped with no models.
      - name: Onramp first-success smoke (Tier 0)
        env:
          JUSTSEARCH_MODELS_DIR: ${{ runner.temp }}\empty-models
        run: node scripts/dev/test-onramp-first-success.mjs

      # On failure, surface the Head/worker logs dev-runner writes to files — the workflow stream only
      # shows dev-runner's own stderr, so a stack that launches but never reports ready would otherwise
      # look silent here. Failure-only; kept as standing diagnostics for this heavy, otherwise-opaque lane.
      - name: Dump stack logs (on failure)
        if: failure()
        shell: bash
        run: |
          # dev-runner's data dir defaults to modules/ui-web/.dev-data (dev-runner.cjs:251), not repo root.
          DD=$(find . -maxdepth 4 -type d -name .dev-data 2>/dev/null | head -1)
          echo "dataDir=$DD"
          if [ -z "$DD" ]; then echo "(.dev-data not found anywhere)"; exit 0; fi
          echo "### run.json / active.json / manifest.json ###"
          find "$DD" \( -name active.json -o -name run.json -o -name manifest.json \) 2>/dev/null | while read -r f; do echo "===== $f ====="; cat "$f" 2>/dev/null; echo; done
          echo "### logs (tail 200 each) ###"
          find "$DD" -name '*.log' 2>/dev/null | while read -r f; do echo "===== $f ====="; tail -200 "$f" 2>/dev/null; echo; done
