name: Build Installer

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      sandboxTestMode:
        description: >-
          Build a Sandbox QUALIFICATION candidate: compiles the shell with
          JUSTSEARCH_RELEASE_SANDBOX_TEST_MODE=1, which permits loopback HTTP feeds and
          runtime trust-root overrides (updater.rs pinned_release_value / ensure_https).
          Required for the in-app N->N+1 lane, because a production binary rejects those
          overrides by design (tempdoc 617 §7.7). NEVER for a published release - the
          guard step below refuses it on a v* tag ref.
        type: boolean
        default: false
      candidateVersion:
        description: >-
          Override the built version (e.g. 0.2.1-qual.1) so two candidates can be produced
          for the N->N+1 lane. Only honoured together with sandboxTestMode; a release cut
          takes its version from gradle.properties as before.
        type: string
        default: ''
      sign:
        description: >-
          Authenticode-sign this build using the configured JUSTSEARCH_CODESIGN_* secrets.
          OFF by default: eSigner signings are metered (currently ~8 per build with the
          signed mirrors; mirror refreshes have their own workflow), so only candidate/release
          builds should spend them. A dispatch against a v* tag ref signs regardless of this
          input — a release cut is never unsigned by accident.
        type: boolean
        default: false
      providerRemainingSignatures:
        description: >-
          Provider-portal remaining signing allocation immediately before a production-signed run.
          Required for a v* tag or sign=true unless the visible self-signed rehearsal variable is on.
        type: string
        default: ''

permissions:
  contents: read

# Every job is signing-capable because Authenticode happens inside the Tauri build. Serialize it
# with the mirror producer so two approved dispatches cannot spend the same provider budget.
concurrency:
  group: release-signing-spend
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  JAVA_VERSION: "25"

jobs:
  build-windows-installer:
    name: Windows NSIS Installer
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release-signing
    # The release-attach step can create/update a GitHub Release when this
    # manual workflow is dispatched against a v* tag ref.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A qualification candidate trusts loopback feeds and lets runtime env replace the pinned
      # metadata root. Shipping that to users would hand the update channel to anything able to
      # set an environment variable, so the two must never coincide. Fail before the build, not
      # after an artifact exists.
      - name: Refuse a qualification build on a release tag
        if: inputs.sandboxTestMode
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            throw "sandboxTestMode was requested on $env:GITHUB_REF. A Sandbox qualification build accepts loopback feeds and runtime trust-root overrides and must never be published. Dispatch it against a branch ref."
          }
          Write-Host "Qualification build (loopback + runtime trust overrides enabled). Not publishable."

      - name: Apply candidate version
        if: inputs.sandboxTestMode && inputs.candidateVersion != ''
        shell: pwsh
        run: |
          $v = '${{ inputs.candidateVersion }}'
          $path = 'gradle.properties'
          $raw = Get-Content -Raw -LiteralPath $path
          if ($raw -notmatch '(?m)^version=') { throw "No version= line in $path" }
          ($raw -replace '(?m)^version=.*$', "version=$v") |
            Set-Content -LiteralPath $path -Encoding utf8 -NoNewline
          Write-Host "Candidate version set to $v"

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          $hostLine = rustc -Vv | Select-String 'host:'
          if ($hostLine -notmatch 'msvc') {
            throw "Wrong Rust target: $hostLine"
          }
          Write-Host "Rust host: $hostLine"

      # Cache Cargo registry + git + target/ keyed off Cargo.lock hash.
      # Cold run pays one-time save cost (~1-2 min at job end); warm runs
      # save ~6-7 min on Rust compile. Tempdoc 374 §"Installer workflow
      # speed investigation" for the full rationale. `workspaces` points
      # at the Tauri shell crate's non-standard location so the action
      # keys off its Cargo.lock and caches its target/.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/shell/src-tauri

      # Cache expensive Gradle outputs in modules/ui/build/:
      # - jlink runtime image (~50 MB, ~30s to regenerate)
      # - JEP 514 AOT caches (Head + Worker, ~16 MB each, ~30s each)
      # - Worker installDist outputs (176 JARs)
      # When inputs unchanged, Gradle's up-to-date check sees files present
      # and skips task execution. When inputs change, cache-miss + rebuild.
      # Key bumped to v2: the v1 cache was saved in an early run when
      # `modules/ui/build/` was only ~187 MB (missing AOT caches, jlink runtime,
      # and the llama-server zip). Subsequent v1 hits restored the incomplete
      # archive, causing Gradle to regenerate ~100 MB of work every run. The v2
      # key forces a fresh save of the full ~290 MB on next miss.
      - name: Cache Gradle module build outputs
        uses: actions/cache@v6
        with:
          path: |
            modules/ui/build
          key: gradle-ui-build-v2-${{ runner.os }}-${{ hashFiles('modules/ui/build.gradle.kts', 'modules/**/build.gradle.kts', 'gradle.properties', 'settings.gradle.kts', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.java') }}
          restore-keys: |
            gradle-ui-build-v2-${{ runner.os }}-

      # Cache llama-server prebuilt zip separately, keyed off pinned version + SHA256.
      # The zip is ~39 MB (CPU-only) and pinned in build.gradle.kts (llamaPrebuiltVersion,
      # llamaPrebuiltSha256). This cache is tiny (compared to Gradle outputs) but avoids
      # re-downloading on every run, and is robust against Gradle cache-save quirks.
      - name: Cache llama-server prebuilt
        uses: actions/cache@v6
        with:
          path: modules/ui/build/llama-server/prebuilt
          key: llama-server-${{ runner.os }}-b8571-40D8C4B9

      # Cache Tauri bundler downloads (NSIS 3.11, nsis_tauri_utils.dll, WebView2 bootstrapper).
      # Tauri downloads these on every cargo-tauri invocation and validates hashes. Caching
      # skips the ~10-15s download step between bundleSidecar and makensis.
      - name: Cache Tauri bundler downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-v2

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            modules/shell/package-lock.json
            modules/ui-web/package-lock.json

      - name: Validate release changelog before building
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          node scripts/release/release-changelog.mjs check
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG structure is invalid." }
          node scripts/release/release-changelog.mjs extract --version $version --out (Join-Path $env:RUNNER_TEMP "release-changelog-section.md")
          if ($LASTEXITCODE -ne 0) { throw "CHANGELOG has no unique non-empty section for $version." }

      # Pre-Gradle diagnostic: verify the llama-server prebuilt zip was actually
      # restored to disk after the dedicated cache hit. If this logs 0 files, the
      # cache restore is broken even though actions/cache reports success.
      - name: Debug - Pre-Gradle cache state
        shell: pwsh
        run: |
          Write-Host "=== Pre-Gradle state of modules/ui/build/ ==="
          if (Test-Path modules/ui/build) {
            Get-ChildItem modules/ui/build -Recurse -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum |
              ForEach-Object { "Total: {0} files, {1:N0} bytes" -f $_.Count, $_.Sum }
            Write-Host "--- Direct children ---"
            Get-ChildItem modules/ui/build -ErrorAction SilentlyContinue | ForEach-Object {
              "  {0}" -f $_.Name
            }
          } else {
            Write-Host "  (modules/ui/build does not exist)"
          }
          Write-Host "=== llama-server prebuilt (expecting llama-b8571-bin-win-cpu-x64.zip, SHA 40D8C4B9...) ==="
          $zipPath = "modules/ui/build/llama-server/prebuilt/llama-b8571-bin-win-cpu-x64.zip"
          if (Test-Path $zipPath) {
            $item = Get-Item $zipPath
            $sha = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
            "  Name:  {0}" -f $item.Name
            "  Size:  {0:N0} bytes" -f $item.Length
            "  SHA:   {0}" -f $sha
            if ($sha -eq "40D8C4B97676E8BE4C69A4B5BCDC25F31213137CAEB35B1563E3867D133EA31C") {
              Write-Host "  VERDICT: SHA matches expected, Gradle should skip download"
            } else {
              Write-Host "  VERDICT: SHA MISMATCH — Gradle will re-download"
            }
          } else {
            Write-Host "  MISSING: cache did not restore the zip"
          }

      - name: Install dependencies
        run: |
          npm ci --prefix modules/shell --audit=false
          npm ci --prefix modules/ui-web --audit=false

      # The command template is step-scoped here only to decide whether the pinned vendor tool is
      # needed. The archive is digest-verified before extraction; no downloaded code runs in this
      # step, and unrelated updater/metadata secrets have not been materialized yet.
      - name: Install verified eSigner CodeSignTool (command mode only)
        shell: pwsh
        env:
          JUSTSEARCH_CODESIGN_COMMAND: ${{ secrets.JUSTSEARCH_CODESIGN_COMMAND }}
        run: |
          if (-not ($env:JUSTSEARCH_CODESIGN_COMMAND -and $env:JUSTSEARCH_CODESIGN_COMMAND -match 'CodeSignTool')) {
            Write-Host "CodeSignTool not referenced by the signing command template - skipping."
            exit 0
          }
          ./scripts/ci/install-codesign-tool.ps1 -Destination (Join-Path $env:RUNNER_TEMP "CodeSignTool")

      - name: Stage authenticated-updater metadata keys
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
        shell: pwsh
        env:
          METADATA_PRIVATE_KEY_PEM: ${{ secrets.JUSTSEARCH_RELEASE_METADATA_PRIVATE_KEY_PEM }}
          METADATA_PUBLIC_KEY_PEM: ${{ vars.JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PEM }}
          RELEASE_DESCRIPTOR_URL: ${{ vars.JUSTSEARCH_RELEASE_DESCRIPTOR_URL }}
        run: |
          if (-not $env:METADATA_PRIVATE_KEY_PEM) {
            throw "JUSTSEARCH_RELEASE_METADATA_PRIVATE_KEY_PEM is required for a tag release."
          }
          if (-not $env:METADATA_PUBLIC_KEY_PEM) {
            throw "JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PEM is required for a tag release."
          }
          # The descriptor URL is a compile-time option_env! pin (updater.rs pinned_release_value):
          # unset, the build stays GREEN while every update check in the shipped app fails at
          # runtime (tempdoc 801 D14.a item 2 — the one silent member of the trust-input set;
          # provisioning audit 2026-08-13, trap b). Assert it here, in the same guard as the keys,
          # with the same shape rules updater.rs enforces (ensure_https + release.v1.json suffix).
          if (-not $env:RELEASE_DESCRIPTOR_URL) {
            throw "JUSTSEARCH_RELEASE_DESCRIPTOR_URL is required for a tag release (compile-pinned; unset = runtime-dead updater in the shipped app)."
          }
          if (-not $env:RELEASE_DESCRIPTOR_URL.StartsWith("https://")) {
            throw "JUSTSEARCH_RELEASE_DESCRIPTOR_URL must be HTTPS (updater.rs ensure_https rejects it at runtime otherwise)."
          }
          if (-not $env:RELEASE_DESCRIPTOR_URL.EndsWith("release.v1.json")) {
            throw "JUSTSEARCH_RELEASE_DESCRIPTOR_URL must end with release.v1.json (updater.rs derives latest.json from that suffix)."
          }
          $expectedDescriptorUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/release.v1.json"
          if ($env:RELEASE_DESCRIPTOR_URL -ne $expectedDescriptorUrl) {
            throw "JUSTSEARCH_RELEASE_DESCRIPTOR_URL must match the current repository identity. Expected '$expectedDescriptorUrl', got '$env:RELEASE_DESCRIPTOR_URL'."
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $privatePath = Join-Path $env:RUNNER_TEMP "justsearch-release-metadata-private.pem"
          $publicPath = Join-Path $env:RUNNER_TEMP "justsearch-release-metadata-public.pem"
          [System.IO.File]::WriteAllText($privatePath, $env:METADATA_PRIVATE_KEY_PEM, $utf8)
          [System.IO.File]::WriteAllText($publicPath, $env:METADATA_PUBLIC_KEY_PEM, $utf8)
          "JUSTSEARCH_RELEASE_METADATA_PRIVATE_KEY_PATH=$privatePath" >> $env:GITHUB_ENV
          "JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PATH=$publicPath" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        # CPU-only alpha per tempdoc 374 §"2026-04-24 rebuild". Without these
        # flags Gradle stages the full 7+ GB sidecar (models + CUDA), which
        # exceeds NSIS's 32-bit address space and crashes makensis (G21).
        # Models and GPU variants land on user machines via the "Install AI"
        # flow, not the base installer.
        #
        # -SkipVerify: verification runs as its own job (installer_verify, below) against the
        # uploaded artifact, not inline here.
        #
        # -AssembleReleaseAssets: stage the full release asset set into
        # dist/installer — installer + SHA256SUMS + the committed
        # justsearch-mcp.mcpb — with a fail-closed MCPB consistency gate. The
        # release-attach step below then uploads all of dist/installer/*.
        # (Tempdoc 726.)
        env:
          ORG_GRADLE_PROJECT_includeCuda: "false"
          ORG_GRADLE_PROJECT_skipOnnxModels: "true"
          # Code-signing secrets (tempdoc 760 Phase 2 item 4). Absent secrets expand to empty
          # strings. sign-windows.ps1 reads these per JUSTSEARCH_CODESIGN_MODE; an unsigned branch
          # rehearsal remains allowed, while an explicit sign request or any v* tag fails before
          # packaging when its credential is absent. (GitHub Actions forbids secrets.* in step
          # `if:`, so the deciding secret is hoisted into env here.)
          JUSTSEARCH_CODESIGN_MODE: ${{ secrets.JUSTSEARCH_CODESIGN_MODE }}
          JUSTSEARCH_CODESIGN_PFX_B64: ${{ secrets.JUSTSEARCH_CODESIGN_PFX_B64 }}
          JUSTSEARCH_CODESIGN_PFX_PASSWORD: ${{ secrets.JUSTSEARCH_CODESIGN_PFX_PASSWORD }}
          JUSTSEARCH_CODESIGN_TIMESTAMP_URL: ${{ secrets.JUSTSEARCH_CODESIGN_TIMESTAMP_URL }}
          JUSTSEARCH_CODESIGN_THUMBPRINT: ${{ secrets.JUSTSEARCH_CODESIGN_THUMBPRINT }}
          JUSTSEARCH_CODESIGN_COMMAND: ${{ secrets.JUSTSEARCH_CODESIGN_COMMAND }}
          # CodeSignTool.bat resolves its bundled JRE and jar RELATIVE TO CWD unless
          # CODE_SIGN_TOOL_PATH points at its install dir; sign-windows.ps1 runs the command
          # template from the repo checkout, so without this the tool dies with "The system
          # cannot find the path specified" (run 31603929359; reproduced locally against the
          # same zip sha256). Inert for pfx/store modes and secrets-absent builds.
          CODE_SIGN_TOOL_PATH: ${{ runner.temp }}\CodeSignTool
          # Compile-time gate read by updater.rs `sandbox_test_mode()` (option_env!). Empty on a
          # normal build, so the production trust pins stay non-overridable.
          JUSTSEARCH_RELEASE_SANDBOX_TEST_MODE: ${{ inputs.sandboxTestMode && '1' || '' }}
          # Signing opt-in (hoisted like the secrets above; the boolean is computed in the run
          # script next to $signConfigured).
          SIGN_REQUESTED: ${{ inputs.sign && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.JUSTSEARCH_TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.JUSTSEARCH_TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          JUSTSEARCH_RELEASE_DESCRIPTOR_URL: ${{ vars.JUSTSEARCH_RELEASE_DESCRIPTOR_URL }}
          JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY: ${{ vars.JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY }}
          JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID: ${{ vars.JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID }}
          JUSTSEARCH_UPDATE_ARTIFACT_PUBLIC_KEY: ${{ vars.JUSTSEARCH_UPDATE_ARTIFACT_PUBLIC_KEY }}
          JUSTSEARCH_UPDATE_ARTIFACT_KEY_ID: ${{ vars.JUSTSEARCH_UPDATE_ARTIFACT_KEY_ID }}
          # Rehearsal-only relaxation (repo VARIABLE, not a secret — it must be visibly on/off):
          # with a self-signed rehearsal cert, sign-windows.ps1 and verify-windows-signature.ps1
          # accept a present-but-chain-untrusted signature instead of hard-failing after all the
          # per-file signings already ran. Unset in production. (Tempdoc 760 rehearsal path.)
          JUSTSEARCH_CODESIGN_ALLOW_UNTRUSTED: ${{ vars.JUSTSEARCH_CODESIGN_ALLOW_UNTRUSTED }}
          JUSTSEARCH_CODESIGN_LEDGER_PATH: ${{ runner.temp }}\justsearch-signing-ledger.jsonl
          JUSTSEARCH_CODESIGN_MAX_SIGNATURES: "12"
          PROVIDER_REMAINING_SIGNATURES: ${{ inputs.providerRemainingSignatures }}
          # Read-only releases API access for derive-release-sequence.mjs (tag lane only).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # On a v* tag ref (a real release cut) also verify server.json version/URL match the
          # tag; skip on non-tag dry-runs where gradle.properties may not match yet. (Tempdoc 726.)
          # NOTE: hashtable splatting, deliberately — array splatting binds flag STRINGS
          # positionally, not as switches ('-Sign' ended up bound to -SetupExePath; caught by the
          # tempdoc 760 self-signed rehearsal run 29909495558, which also revealed the original
          # array-splatted -VerifyReleaseVersion had the same latent bug, never exercised because
          # no tag dispatch has run since it was added).
          $extra = @{}
          $isReleaseTag = $env:GITHUB_REF -like 'refs/tags/v*'
          if ($isReleaseTag) {
            $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
            if ($tag -match '^v\d+\.\d+\.\d+$') {
              $extra['AssembleUpdaterAssets'] = $true
              # Rollback protection for release metadata. This was GITHUB_RUN_NUMBER, which GitHub
              # scopes to the workflow FILE: renaming/moving/recreating this file resets it to 1,
              # and updater.rs permanently refuses any descriptor below its persisted
              # highest_accepted_sequence — bricking updates for every client that ever accepted
              # one, with no in-client recovery (tempdoc 801 D14.b). The derivation below reads the
              # sequence out of the already-published release.v1.json assets instead, so it is
              # independent of this file's identity and monotonic against exactly the values
              # clients can hold. Its floor is 41 (= v0.2.0's published 40, plus one), which is why
              # even a zero-descriptor API result can never regress below what is already shipped.
              # --exclude-tag keeps a re-run of an already-published tag deriving the SAME value
              # (the property GITHUB_RUN_NUMBER's rerun-stability used to provide).
              # The script exits non-zero rather than guessing; that must fail the build.
              $derivedSequence = & node scripts/ci/derive-release-sequence.mjs --repo $env:GITHUB_REPOSITORY --exclude-tag $tag
              if ($LASTEXITCODE -ne 0) { throw "derive-release-sequence.mjs failed (exit $LASTEXITCODE); refusing to cut a release with a guessed sequence." }
              $extra['ReleaseSequence'] = [long]($derivedSequence | Select-Object -Last 1).Trim()
              $extra['InstallerUrl'] = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/{filename}"
              $extra['ArtifactKeyId'] = $env:JUSTSEARCH_UPDATE_ARTIFACT_KEY_ID
              $extra['ArtifactPublicKey'] = $env:JUSTSEARCH_UPDATE_ARTIFACT_PUBLIC_KEY
              $extra['MetadataKeyId'] = $env:JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID
              $extra['MetadataPrivateKeyPath'] = $env:JUSTSEARCH_RELEASE_METADATA_PRIVATE_KEY_PATH
              $extra['MetadataPublicKeyPath'] = $env:JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PATH
            }
          }
          # Engage signing only when BOTH hold: a credential for the configured mode is present
          # (pfx b64 / store thumbprint / command template), AND signing was requested — via the
          # `sign` dispatch input or a v* tag ref (a release cut always signs). Requested-but-
          # unconfigured fails here, before any packaging work.
          # Opt-in default per owner decision 2026-08-12: eSigner signings are metered, so
          # ordinary dispatches must not spend them (supersedes 760 item 4's auto-engage).
          $projectVersionLine = Get-Content -LiteralPath gradle.properties | Where-Object { $_ -match '^version=' }
          if (@($projectVersionLine).Count -ne 1) { throw "gradle.properties must contain exactly one version= line." }
          $projectVersion = ($projectVersionLine -split '=', 2)[1].Trim()
          $allowUntrustedRaw = if ($env:JUSTSEARCH_CODESIGN_ALLOW_UNTRUSTED) { $env:JUSTSEARCH_CODESIGN_ALLOW_UNTRUSTED.Trim().ToLowerInvariant() } else { '' }
          $decisionJson = & ./scripts/ci/resolve-release-signing.ps1 `
            -GitRef $env:GITHUB_REF `
            -ProjectVersion $projectVersion `
            -Mode $env:JUSTSEARCH_CODESIGN_MODE `
            -SignInput:($env:SIGN_REQUESTED -eq '1') `
            -PfxBase64 $env:JUSTSEARCH_CODESIGN_PFX_B64 `
            -PfxPassword $env:JUSTSEARCH_CODESIGN_PFX_PASSWORD `
            -TimestampUrl $env:JUSTSEARCH_CODESIGN_TIMESTAMP_URL `
            -Thumbprint $env:JUSTSEARCH_CODESIGN_THUMBPRINT `
            -CommandTemplate $env:JUSTSEARCH_CODESIGN_COMMAND `
            -AllowUntrusted:($allowUntrustedRaw -in @('1', 'true', 'yes')) `
            -ProviderRemainingSignatures $env:PROVIDER_REMAINING_SIGNATURES `
            -SignatureMaximum 12
          $signingDecision = $decisionJson | ConvertFrom-Json
          if ($signingDecision.packageSwitch -eq 'Release') { $extra['Release'] = $true }
          elseif ($signingDecision.packageSwitch -eq 'Sign') { $extra['Sign'] = $true }
          else { Write-Host "Signing not requested for this non-tag dispatch; building unsigned." }
          $signRequested = [bool]$signingDecision.signingRequested
          if (Test-Path -LiteralPath $env:JUSTSEARCH_CODESIGN_LEDGER_PATH) {
            Remove-Item -LiteralPath $env:JUSTSEARCH_CODESIGN_LEDGER_PATH -Force
          }
          if (Test-Path -LiteralPath ($env:JUSTSEARCH_CODESIGN_LEDGER_PATH + '.attempts.jsonl')) {
            Remove-Item -LiteralPath ($env:JUSTSEARCH_CODESIGN_LEDGER_PATH + '.attempts.jsonl') -Force
          }
          # Signed-mirror pins (packaging/signed-mirrors.v1.json; tempdoc 760/772 §K sign-once). When a
          # vendored payload has a committed, COMPLETE signed-mirror entry, point the matching gradle
          # download-override property pair at the once-signed re-hosted copy so the build fetches it
          # instead of the default upstream pin. Pins live in the committed file (not repo variables) so
          # each bump is PR-reviewed supply-chain history. An absent/empty entry sets nothing =>
          # default pins => byte-identical build. A half-complete entry (url XOR sha256)
          # fails loudly HERE, before the build, mirroring the all-or-nothing pin in build.gradle.kts.
          $mirrorsPath = "packaging/signed-mirrors.v1.json"
          if (Test-Path $mirrorsPath) {
            $mirrors = (Get-Content -Raw $mirrorsPath | ConvertFrom-Json).mirrors
            # payload key in the file -> the two ORG_GRADLE_PROJECT_* override properties it drives
            $overrides = @{
              'llama-cpu' = @('llamaPrebuiltUrlOverride', 'llamaPrebuiltSha256Override')
              'tesseract' = @('tesseractSourceUrlOverride', 'tesseractSourceSha256Override')
            }
            foreach ($payload in $overrides.Keys) {
              $entry = if ($mirrors) { $mirrors.$payload } else { $null }
              if ($null -eq $entry) { continue }
              $hasUrl = $entry.url -and $entry.url.Trim()
              $hasSha = $entry.sha256 -and $entry.sha256.Trim()
              if ($hasUrl -and $hasSha) {
                $props = $overrides[$payload]
                Set-Item "env:ORG_GRADLE_PROJECT_$($props[0])" $entry.url.Trim()
                Set-Item "env:ORG_GRADLE_PROJECT_$($props[1])" $entry.sha256.Trim()
                Write-Host "Signed mirror active for '$payload' -> $($entry.url.Trim())"
              } elseif ($hasUrl -or $hasSha) {
                throw "signed-mirrors.v1.json entry '$payload' is half-complete: both 'url' and 'sha256' are required. A mirror URL with the default hash can never verify; the default URL with a mirror hash rejects the genuine pinned artifact. Provide BOTH or remove the entry."
              }
            }
          }
          ./scripts/ci/package-installer-win.ps1 -OutDir dist/installer -SkipVerify -AssembleReleaseAssets @extra

          if ($signRequested -and (Test-Path -LiteralPath $env:JUSTSEARCH_CODESIGN_LEDGER_PATH)) {
            $ledger = @(Get-Content -LiteralPath $env:JUSTSEARCH_CODESIGN_LEDGER_PATH | Where-Object { $_ -and $_.Trim() })
            $attempts = @(
              Get-Content -LiteralPath ($env:JUSTSEARCH_CODESIGN_LEDGER_PATH + '.attempts.jsonl') -ErrorAction Stop |
                Where-Object { $_ -and $_.Trim() } |
                ForEach-Object { $_ | ConvertFrom-Json } |
                Where-Object { $_.event -eq 'attempt-start' }
            )
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Authenticode signing`n`nProvider attempts reserved: $($attempts.Count) / 12 reviewed maximum. Verified signatures: $($ledger.Count).`n"
          }

      # The bundler swallows the signCommand child's output on failure, so sign-windows.ps1 tees
      # its messages to a log; print it when the build fails (tempdoc 760 rehearsal lesson).
      - name: Debug - sign-windows log (on failure)
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP "justsearch-sign-windows.log"
          if (Test-Path $log) { Write-Host "=== sign-windows.ps1 log ==="; Get-Content $log } else { Write-Host "no sign-windows log at $log" }

      # Diagnostic: log modules/ui/build contents + sizes so we can see what the
      # Post Cache step will save. Tempdoc 374 speed investigation: the cache
      # restores only ~187 MB even though the dir should contain more, yet the
      # llama-server zip is re-downloaded on cached runs. This log helps pinpoint
      # what's actually present at save time.
      - name: Debug - Gradle build output contents
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== modules/ui/build/ top-level ==="
          Get-ChildItem modules/ui/build -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            $size = if ($_.PSIsContainer) {
              (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            } else { $_.Length }
            "{0,-30} {1,12:N0}" -f $_.Name, $size
          }
          Write-Host "=== modules/ui/build/llama-server/prebuilt/ ==="
          Get-ChildItem modules/ui/build/llama-server/prebuilt -ErrorAction SilentlyContinue | ForEach-Object {
            "{0,-50} {1,12:N0}" -f $_.Name, $_.Length
          }
          Write-Host "=== Tauri bundler cache ==="
          Get-ChildItem "$env:LOCALAPPDATA\tauri" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            "{0,-50} {1,12:N0}" -f $_.Name, $_.Length
          }

      - name: Upload installer artifact
        # Non-fatal: Actions artifact storage has a hard account quota (and a
        # 6-12h usage-recalc lag). A multi-hundred-MB installer can exceed it, which would
        # otherwise fail the job BEFORE the release-attach step (a condition-only
        # `if` still carries the implicit success() gate). Releases use separate
        # storage, so let the job proceed to the release attach regardless.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/*
          # 7d, not 30: this artifact has no downstream consumer (the release attaches the
          # .exe from disk), so a multi-hundred-MB build only needs a short manual-download window.
          # Curbs the artifact-storage entropy that blocked an earlier build. (tempdoc 562 item 4.)
          retention-days: 7

      # Transactional updater publication: any failure leaves the release in draft state.
      - name: Draft, round-trip verify, and publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # The round-trip verify below passes these two to app-release-assets.mjs. They were
          # previously step-scoped env on "Build installer" ONLY, so here they were unset and the
          # first stable tag would have died at "Downloaded authenticated updater set failed
          # verification" AFTER the draft Release existed (provisioning audit 2026-08-13, trap c).
          JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY: ${{ vars.JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY }}
          JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID: ${{ vars.JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID }}
        run: |
          $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
          $version = $tag.Substring(1)
          $trustNotice = Join-Path $env:RUNNER_TEMP "release-trust-notice.md"
          $generatedNotes = Join-Path $env:RUNNER_TEMP "release-generated-notes.md"
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          ### Verify your download
          Before running the installer, verify its integrity with the accompanying ``SHA256SUMS``.
          Full instructions are in
          [verify-your-download](https://github.com/justsearch-app/justsearch/blob/main/docs/how-to/verify-your-download.md).
          "@ | Set-Content -LiteralPath $trustNotice -Encoding UTF8

          $generatedJson = gh api --method POST "/repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag
          if ($LASTEXITCODE -ne 0) { throw "GitHub could not generate release notes for $tag." }
          $generated = $generatedJson | ConvertFrom-Json
          if (-not $generated.body) { throw "GitHub returned empty generated notes for $tag." }
          [System.IO.File]::WriteAllText($generatedNotes, ([string]$generated.body), (New-Object System.Text.UTF8Encoding($false)))
          node scripts/release/release-changelog.mjs compose --version $version `
            --trust-notice-file $trustNotice --generated-notes-file $generatedNotes --out $notes
          if ($LASTEXITCODE -ne 0) { throw "Release-note composition failed for $tag." }

          $existingJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $tag." }
          } else {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "Release $tag is already published; refusing to mutate it during a transactional retry."
            }
            gh release edit $tag --title $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh draft release body for $tag." }
          }

          $releaseAssets = @(Get-ChildItem -LiteralPath "dist/installer" -File | ForEach-Object FullName)
          if ($releaseAssets.Count -eq 0) { throw "No release assets were assembled." }
          gh release upload $tag @releaseAssets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload the draft release asset set." }

          $verifyDir = Join-Path $env:RUNNER_TEMP "justsearch-release-roundtrip"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          gh release download $tag --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw "Failed to download draft release assets for verification." }

          $sums = Join-Path $verifyDir "SHA256SUMS"
          if (-not (Test-Path -LiteralPath $sums -PathType Leaf)) { throw "Downloaded SHA256SUMS is missing." }
          foreach ($line in Get-Content -LiteralPath $sums) {
            if (-not $line -or $line.StartsWith("#")) { continue }
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed SHA256SUMS line: $line" }
            $asset = Join-Path $verifyDir $Matches[2]
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Checksum asset missing: $($Matches[2])" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch after release round-trip: $($Matches[2])" }
          }

          $installers = @(Get-ChildItem -LiteralPath $verifyDir -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Downloaded release has no unique NSIS installer." }
          $installer = $installers[0]
          if (Test-Path -LiteralPath (Join-Path $verifyDir "release.v1.json")) {
            & node scripts/release/app-release-assets.mjs verify `
              --installer $installer.FullName `
              --artifact-signature "$($installer.FullName).sig" `
              --metadata-public-key $env:JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PATH `
              --metadata-key-id $env:JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID `
              --metadata-root-public-key $env:JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY `
              --release-dir $verifyDir
            if ($LASTEXITCODE -ne 0) { throw "Downloaded authenticated updater set failed verification." }
          }

          $publishArgs = @("release", "edit", $tag, "--draft=false")
          if ($tag -match '-(alpha|beta|rc)\.') {
            $publishArgs += "--prerelease"
          } else {
            $publishArgs += "--prerelease=false"
          }
          gh @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "Verified release could not be published; it remains draft." }

  installer_verify:
    name: Verify installer (packaged)
    needs: build-windows-installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The verify script auto-enables EvidenceBundle capture whenever $env:CI is set (which
      # GitHub Actions always sets) -- its validator (scripts/evidence/validate-evidencebundle-v1.mjs)
      # imports ajv/ajv-formats from the ROOT package.json, so this job needs a root `npm ci`
      # even though it never touches modules/ui-web or modules/shell directly.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --audit=false

      - name: Download installer artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: dist/installer

      # tempdoc 805 Part G.4 -- the packaged verify lane. BLOCKING since 2026-08-04: the
      # report-only baseline ran green twice (runs 30916527477 product legs / 30918470316 fully,
      # incl. EvidenceBundle after PR #363), and all THREE legs -- fresh, restart, and
      # upgrade-arrival -- passed locally against the run-30918470316 artifact. The
      # upgrade-arrival leg's repairNeeded assertions target fields that shipped with the 805
      # campaign (PR #362), so the leg runs here permanently.
      # Tempdoc 884 §F row 7 -- the artifact half of check-installer-execution-level.mjs, which
      # was invoked by nothing. ADR-0024's json-path probe already covers the CONFIG assertion
      # (installMode: currentUser), so this step exists for the half the config cannot see: a
      # change to modules/shell/src-tauri/nsis/installer-hooks.nsh can leave tauri.conf.json
      # correct while the BUILT installer still requests elevation, which is a UAC prompt the
      # README says will not appear. Runs before the verify lane so an elevating installer is
      # named as such rather than surfacing as a downstream install failure.
      - name: Built installer does not request elevation
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist/installer -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "No *-setup.exe found in dist/installer after artifact download." }
          node scripts/ci/check-installer-execution-level.mjs --installer $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "Built installer requests elevation; see the check output above." }

      - name: Run packaged verify lane
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist/installer -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { throw "No *-setup.exe found in dist/installer after artifact download." }
          ./scripts/ci/verify-installer-nsis-win.ps1 -SetupExePath $setup.FullName -IncludeUpgradeArrival
