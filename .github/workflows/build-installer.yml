name: Build Installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sandboxTestMode:
        description: Qualification build with loopback feeds and test trust roots (branch refs only)
        type: boolean
        default: false
      candidateVersion:
        description: Version override for a qualification build
        type: string
        default: ''
permissions:
  contents: read
  actions: read
# Serialize candidate sequence derivation and draft upload with publication.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-candidate' || format('manual-windows-{0}', github.ref) }}
  cancel-in-progress: false
env:
  JUSTSEARCH_RELEASE_DESCRIPTOR_URL: https://github.com/justsearch-app/justsearch/releases/latest/download/release.v2.json
  JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY: ${{ vars.JUSTSEARCH_RELEASE_METADATA_ROOT_PUBLIC_KEY }}
  JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID: ${{ vars.JUSTSEARCH_RELEASE_METADATA_ROOT_KEY_ID }}
  JUSTSEARCH_UPDATE_ARTIFACT_PUBLIC_KEY: ${{ vars.JUSTSEARCH_UPDATE_ARTIFACT_PUBLIC_KEY }}
  JUSTSEARCH_UPDATE_ARTIFACT_KEY_ID: ${{ vars.JUSTSEARCH_UPDATE_ARTIFACT_KEY_ID }}
jobs:
  manual-windows:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-installer-windows.yml
    with:
      sandboxTestMode: ${{ inputs.sandboxTestMode }}
      candidateVersion: ${{ inputs.candidateVersion }}
  prepare:
    environment: release-signing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
      - name: Refuse qualification inputs on release refs
        env:
          SANDBOX: ${{ inputs.sandboxTestMode }}
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
        run: test "$SANDBOX" != true && test -z "$CANDIDATE_VERSION"
      - name: Stage public metadata key
        env:
          METADATA_PUBLIC_KEY_PEM: ${{ vars.JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PEM }}
        run: |
          printf '%s' "$METADATA_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/metadata-public.pem"
          echo "JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PATH=$RUNNER_TEMP/metadata-public.pem" >> "$GITHUB_ENV"
      - name: Admit release before any signing
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CODESIGN_COMMAND: ${{ secrets.JUSTSEARCH_CODESIGN_COMMAND != '' }}
          HAS_TAURI_KEY: ${{ secrets.JUSTSEARCH_TAURI_UPDATER_PRIVATE_KEY != '' }}
          HAS_METADATA_KEY: ${{ secrets.JUSTSEARCH_RELEASE_METADATA_PRIVATE_KEY_PEM != '' }}
        run: |
          node scripts/release/release-candidate.mjs admit
          node scripts/ci/sync-version.mjs --require-release-semver --what-if
          node scripts/ci/check-mcpb-consistency.mjs --release-version "${GITHUB_REF_NAME#v}"
      - name: Reuse original predecessor context on same-run retry
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/packaging-smoke.mjs cached release-context-${{ github.run_id }}
      - name: Derive published predecessor sequence and compatibility
        if: steps.context.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/context
          node scripts/ci/derive-release-sequence.mjs --exclude-tag "$GITHUB_REF_NAME" --compat-baseline-out dist/context/compatibility-baseline.json > dist/context/sequence
          node scripts/release/app-release-assets.mjs check-compatibility --compatibility governance/store-recoverability.v1.json --compat-baseline dist/context/compatibility-baseline.json
      - uses: actions/upload-artifact@v7
        if: steps.context.outputs.exists != 'true'
        with:
          name: release-context-${{ github.run_id }}
          path: dist/context/*
          if-no-files-found: error
  windows:
    needs: prepare
    uses: ./.github/workflows/build-installer-windows.yml
    with:
      release: true
  linux:
    needs: prepare
    uses: ./.github/workflows/build-installer-linux.yml
    with:
      release: true
  assemble:
    environment: release-signing
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
      - name: Reuse an assembled candidate on upload retry
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/packaging-smoke.mjs cached candidate-assets-${{ github.run_id }}
      - uses: actions/download-artifact@v8
        if: steps.cached.outputs.exists != 'true'
        with:
          name: windows-installer
          path: dist/inputs/windows
      - uses: actions/download-artifact@v8
        if: steps.cached.outputs.exists != 'true'
        with:
          name: linux-installer-${{ github.run_id }}
          path: dist/inputs/linux
      - uses: actions/download-artifact@v8
        if: steps.cached.outputs.exists != 'true'
        with:
          pattern: windows-check-${{ github.run_id }}-*
          merge-multiple: true
          path: dist/inputs/checks
      - uses: actions/download-artifact@v8
        if: steps.cached.outputs.exists != 'true'
        with:
          name: release-context-${{ github.run_id }}
          path: dist/inputs/context
      - name: Stage public metadata key
        if: steps.cached.outputs.exists != 'true'
        env:
          METADATA_PUBLIC_KEY_PEM: ${{ vars.JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PEM }}
        run: |
          printf '%s' "$METADATA_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/metadata-public.pem"
          echo "JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PATH=$RUNNER_TEMP/metadata-public.pem" >> "$GITHUB_ENV"
      - name: Assemble and verify the closed asset set
        if: steps.cached.outputs.exists != 'true'
        env:
          METADATA_PRIVATE_KEY_PEM: ${{ secrets.JUSTSEARCH_RELEASE_METADATA_PRIVATE_KEY_PEM }}
        run: |
          node scripts/ci/packaging-smoke.mjs plan dist/inputs dist/candidate-inputs.json
          node scripts/release/release-candidate.mjs build dist/candidate-inputs.json
      - name: Attest the candidate and all payloads
        if: steps.cached.outputs.exists != 'true'
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/candidate/*
      - name: Preserve provenance and checksum every asset
        if: steps.cached.outputs.exists != 'true'
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" dist/candidate/provenance.sigstore.json
          node scripts/release/release-candidate.mjs checksums dist/candidate
      - uses: actions/upload-artifact@v7
        if: steps.cached.outputs.exists != 'true'
        with:
          name: candidate-assets-${{ github.run_id }}
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
      - uses: actions/download-artifact@v8
        with:
          name: candidate-assets-${{ github.run_id }}
          path: dist/candidate
      - name: Stage public metadata key
        env:
          METADATA_PUBLIC_KEY_PEM: ${{ vars.JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PEM }}
        run: |
          printf '%s' "$METADATA_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/metadata-public.pem"
          echo "JUSTSEARCH_RELEASE_METADATA_PUBLIC_KEY_PATH=$RUNNER_TEMP/metadata-public.pem" >> "$GITHUB_ENV"
      - name: Upload draft and round-trip verify; never publish or clobber
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release-candidate.mjs upload dist/candidate
