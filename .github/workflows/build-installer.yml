name: Native TLS proof packages (temporary)

# Build-only carrier. These public TEST-pinned packages are never release assets.
on:
  workflow_dispatch:
    inputs:
      beforeSha:
        description: Exact predecessor source commit
        type: string
        required: true
        default: '379f5936c8b9c0c23c59765f6d970bd33eeab8a8'
      candidateSha:
        description: Exact rustls candidate source commit
        type: string
        required: true
        default: '1f152599a1bd715e34e95c3bbcd48ff03bcb246b'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-tls-proof-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    name: TEST packages / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      BEFORE_SHA: ${{ inputs.beforeSha }}
      CANDIDATE_SHA: ${{ inputs.candidateSha }}
      PROOF_PLATFORM: ${{ matrix.platform }}
      RELEASE_BUILD: 'false'
      ORG_GRADLE_PROJECT_includeCuda: 'false'
      ORG_GRADLE_PROJECT_skipOnnxModels: 'true'
      JUSTSEARCH_CODESIGN_LEDGER_PATH: ${{ runner.temp }}/native-tls-unused-signing-ledger.jsonl
    steps:
      - name: Checkout carrier, without retained credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Admit exact sources and retain helpers outside source checkouts
        run: python scripts/ci/native-tls-proof-build.py stage
      - name: Checkout exact predecessor
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.beforeSha }}
          path: proof-before
          persist-credentials: false
      - name: Checkout exact candidate (probe and target)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidateSha }}
          path: proof-candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            proof-before/modules/shell/package-lock.json
            proof-before/modules/ui-web/package-lock.json
            proof-candidate/modules/shell/package-lock.json
            proof-candidate/modules/ui-web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-tls-proof-${{ matrix.platform }}
          workspaces: |
            proof-before/modules/shell/src-tauri -> target
            proof-candidate/modules/shell/src-tauri -> target
      - name: Cache Gradle UI outputs
        uses: actions/cache@v6
        with:
          path: |
            proof-before/modules/ui/build
            proof-candidate/modules/ui/build
          key: native-tls-ui-${{ runner.os }}-${{ hashFiles('proof-candidate/modules/ui/build.gradle.kts', 'proof-candidate/modules/**/build.gradle.kts', 'proof-candidate/gradle.properties', 'proof-candidate/settings.gradle.kts', 'proof-candidate/gradle/verification-metadata.xml', 'proof-candidate/gradle/wrapper/gradle-wrapper.properties', 'proof-candidate/**/*.java') }}
          restore-keys: native-tls-ui-${{ runner.os }}-
      - name: Cache pinned llama prebuilt downloads
        uses: actions/cache@v6
        with:
          path: |
            proof-before/modules/ui/build/llama-server/prebuilt
            proof-candidate/modules/ui/build/llama-server/prebuilt
          key: native-tls-llama-${{ runner.os }}-b8571-40D8C4B9
      - name: Cache Windows Tauri bundler downloads
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-v2
      - name: Linux native build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential binutils libssl-dev pkg-config
      - name: Initialize shared deterministic public TEST pins
        run: python "$RUNNER_TEMP/native-tls-proof/native-tls-proof-build.py" initialize
      - name: Build predecessor / 0.3.80
        run: python "$RUNNER_TEMP/native-tls-proof/native-tls-proof-build.py" build before
      - name: Build candidate probe / 0.3.81
        run: python "$RUNNER_TEMP/native-tls-proof/native-tls-proof-build.py" build probe
      - name: Build candidate target / 0.3.82 (warm candidate outputs)
        run: python "$RUNNER_TEMP/native-tls-proof/native-tls-proof-build.py" build target
      - name: Seal public build evidence and erase ephemeral private fixture material
        id: seal
        if: always()
        run: python "$RUNNER_TEMP/native-tls-proof/native-tls-proof-build.py" finalize
      - name: Preserve immutable packages, public fixtures, provenance and failures
        if: always() && steps.seal.outputs.safe_export == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-tls-packages-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-tls-proof/public/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
