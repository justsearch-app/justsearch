name: Daily Packaging Smoke
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-packaging-smoke
  cancel-in-progress: false
jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/packaging-smoke.mjs changed
  windows:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/build-installer-windows.yml
  linux:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/build-installer-linux.yml
