name: Prepare WinGet Manifests

# Operator-triggered projection only. This workflow reads one already-published stable GitHub
# Release, authenticates its installer identity through the GitHub API, emits deterministic
# WinGet manifests and a ready-to-copy PR body, and uploads them as an artifact. It does not edit
# the GitHub Release, push a branch, open a PR, or submit anything to winget-pkgs.
on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Published stable tag to project into WinGet manifests (for example v0.2.0).
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "24.14.0"

concurrency:
  group: prepare-winget-${{ inputs.releaseTag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate and validate WinGet manifests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install generator dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --audit=false

      - name: Test the deterministic generator
        shell: pwsh
        run: node --test scripts/release/winget-manifests.test.mjs

      - name: Resolve immutable release input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.releaseTag }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "releaseTag must be a stable three-part tag such as v0.2.0"
          }
          $version = $tag.Substring(1)
          $release = gh api ("repos/{0}/releases/tags/{1}" -f $env:GITHUB_REPOSITORY, $tag) |
            ConvertFrom-Json
          if ($release.draft -or $release.prerelease -or -not $release.published_at) {
            throw "WinGet manifests require an already-published, non-prerelease GitHub Release"
          }

          $assetName = "JustSearch_${version}_x64-setup.exe"
          $assets = @($release.assets | Where-Object { $_.name -ceq $assetName })
          if ($assets.Count -ne 1) {
            throw "Expected exactly one release asset named '$assetName'; found $($assets.Count)"
          }
          $asset = $assets[0]
          if ($asset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "GitHub did not provide a SHA-256 digest for '$assetName'; refusing an unauthenticated input"
          }
          $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$assetName"
          if ($asset.browser_download_url -cne $expectedUrl) {
            throw "Installer URL does not match the canonical release asset URL"
          }

          $checksumAssets = @($release.assets | Where-Object { $_.name -ceq 'SHA256SUMS' })
          if ($checksumAssets.Count -ne 1) {
            throw "Expected exactly one release asset named 'SHA256SUMS'; found $($checksumAssets.Count)"
          }
          $checksumAsset = $checksumAssets[0]
          if ($checksumAsset.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "GitHub did not provide a SHA-256 digest for SHA256SUMS"
          }
          $expectedChecksumUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/SHA256SUMS"
          if ($checksumAsset.browser_download_url -cne $expectedChecksumUrl) {
            throw "SHA256SUMS URL does not match the canonical release asset URL"
          }

          New-Item -ItemType Directory -Force -Path dist/winget | Out-Null
          $checksumPath = 'dist/winget/SHA256SUMS'
          Invoke-WebRequest -Uri $checksumAsset.browser_download_url -OutFile $checksumPath
          $downloadedChecksumSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $checksumPath).Hash.ToLowerInvariant()
          $githubChecksumSha = ([string]$checksumAsset.digest).Substring(7).ToLowerInvariant()
          if ($downloadedChecksumSha -cne $githubChecksumSha) {
            throw "Downloaded SHA256SUMS does not match its GitHub asset digest"
          }
          $escapedAssetName = [regex]::Escape($assetName)
          $checksumMatches = @(Get-Content -LiteralPath $checksumPath | Where-Object {
            $_ -match "^([0-9a-fA-F]{64})[ `t]+\*?$escapedAssetName$"
          })
          if ($checksumMatches.Count -ne 1) {
            throw "Expected exactly one SHA256SUMS entry for '$assetName'; found $($checksumMatches.Count)"
          }
          $checksumMatches[0] -match '^([0-9a-fA-F]{64})' | Out-Null
          $publishedInstallerSha = $Matches[1].ToLowerInvariant()
          $githubInstallerSha = ([string]$asset.digest).Substring(7).ToLowerInvariant()
          if ($publishedInstallerSha -cne $githubInstallerSha) {
            throw "Installer digest mismatch: SHA256SUMS and the GitHub asset digest disagree"
          }

          $input = [ordered]@{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            releaseId = [long]$release.id
            tag = $tag
            version = $version
            # pwsh 7 ConvertFrom-Json turns the ISO-8601 published_at into a [datetime]; [string]
            # would render it culture-formatted (first run 34096946647 on v0.3.0 failed the
            # generator with "release.publishedAt must be a UTC ISO-8601 timestamp"). Re-emit it
            # explicitly as the UTC wire form the generator and the WinGet ReleaseDate expect.
            publishedAt = ([datetime]$release.published_at).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ", [cultureinfo]::InvariantCulture)
            draft = [bool]$release.draft
            prerelease = [bool]$release.prerelease
            checksumManifest = [ordered]@{
              assetId = [long]$checksumAsset.id
              name = [string]$checksumAsset.name
              url = [string]$checksumAsset.browser_download_url
              sha256 = $githubChecksumSha
              sizeBytes = [long]$checksumAsset.size
            }
            installer = [ordered]@{
              assetId = [long]$asset.id
              name = [string]$asset.name
              url = [string]$asset.browser_download_url
              sha256 = $publishedInstallerSha
              githubSha256 = $githubInstallerSha
              sizeBytes = [long]$asset.size
            }
          }
          $input | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -LiteralPath dist/winget/release-input.v1.json

      - name: Generate manifests and PR body
        shell: pwsh
        run: |
          $release = Get-Content -Raw -LiteralPath dist/winget/release-input.v1.json | ConvertFrom-Json
          $manifestDir = "dist/winget/manifests/e/eliasjustus/JustSearch/$($release.version)"
          node scripts/release/winget-manifests.mjs generate `
            --metadata packaging/winget/package.v1.json `
            --release dist/winget/release-input.v1.json `
            --output $manifestDir `
            --pr-body dist/winget/PR_BODY.md
          node scripts/release/winget-manifests.mjs check `
            --metadata packaging/winget/package.v1.json `
            --release dist/winget/release-input.v1.json `
            --output $manifestDir
          winget validate --manifest $manifestDir --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget validate failed (exit=$LASTEXITCODE)"
          }

      - name: Upload prepared submission bundle
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests-${{ inputs.releaseTag }}
          path: dist/winget/**
          if-no-files-found: error
          retention-days: 14
