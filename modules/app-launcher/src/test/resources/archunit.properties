# ArchUnit configuration for JustSearch
# See: https://www.archunit.org/userguide/html/000_Index.html#_configuration

# Skip transitive classpath resolution — 10-60x speedup for large classpaths.
# Safe because all rules in this project check package membership / dependency
# direction, not external class metadata (annotations, interfaces).
resolveMissingDependenciesFromClassPath=false

# Frozen violation store for UnreferencedCodeTest#no_unreferenced_non_public_methods (tempdoc 966
# D6), configured like modules/dead-code-audit. The committed store under
# `modules/app-launcher/archunit_store/` is the accepted set of non-public production methods that
# no production code calls (today: methods only tests call). A new one fails the build; adding a
# line to the store needs a test-intent entry and acceptance (tempdoc 966 D1).
#
# The path is also passed as an absolute path from build.gradle.kts
# (`archunit.freeze.store.default.path`), because ArchUnit resolves a relative store path against
# the JVM working directory and system properties prefixed `archunit.` override this file.
freeze.store.default.path=archunit_store

# The store is committed, so creating one is never correct in a normal run: a missing store means
# the path is wrong or the checkout is incomplete, and silently creating an empty one would freeze
# every current violation as accepted. UnreferencedCodeTest also refuses a store that lacks the
# method rule (a renamed rule description) and `freeze.refreeze=true` while this is false.
#
# Seeding (the only way to re-freeze, never part of normal verification):
#   1. empty modules/app-launcher/archunit_store/ (keep the directory: it is a declared Gradle
#      input, and the test task fails when it is missing)
#   2. set this to true
#   3. ./gradlew :modules:app-launcher:test --tests io.justsearch.app.launcher.UnreferencedCodeTest
#   4. set this back to false; commit the new store with a test-intent entry and acceptance.
freeze.store.default.allowStoreCreation=false

# Left at the default (true) on purpose: it is the ratchet's shrink direction. Removing a frozen
# method (or giving it a production caller) and re-running drops it from the store; growth still
# fails.
freeze.store.default.allowStoreUpdate=true
