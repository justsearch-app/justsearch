[package]
name = "shell"
default-run = "shell"
version = "0.3.0"
description = "A Tauri App"
authors = ["JustSearch Contributors"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Lane F stage B item B10 (stages/B.md Q2). This binary proves the shared supervision loop with a
# distinct fake actuator. Production child ownership is exercised by `engine_host.rs` library tests;
# the conformance adapter does not stand in for `ShellActuator` or its OS/Tauri bindings.
[[bin]]
name = "supervisor-conformance"
path = "src/bin/supervisor_conformance.rs"
# Keep this test harness out of Tauri installer binary discovery.
required-features = ["supervisor-conformance"]

[features]
supervisor-conformance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 2.4 requires Tauri 2.12; keep the Tauri version locked on main.
tauri-plugin-global-shortcut = "=2.3.1"
# Slice 489 §15 — OS-level deep-link plugin enabling `justsearch://...` URLs
# from external apps (browser, terminal, mail client) to route into the
# running instance via single-instance plugin handoff.
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "=2.10.1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
# File operations
open = "5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by Tauri; present bypasses Tao's stale hidden/minimized focus guard.
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"    # Optimize for size — Tauri shell is a thin wrapper, not compute-heavy
strip = true       # Remove symbol tables from binary

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
