<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="justsearch-version" content="%JUSTSEARCH_VERSION%" />
    <title>JustSearch</title>
    <style>
      %BOOT_FRAME_TOKENS%
      body { margin: 0; }
      :is(#boot-frame, #boot-failure) {
        box-sizing: border-box; position: fixed; inset: 0; z-index: var(--z-overlay-chrome);
        color: var(--boot-frame-text, var(--text-primary)); background: var(--boot-frame-background, var(--surface-0));
        font-family: var(--font-native); font-size: var(--font-size-md); line-height: 1.5;
        overflow: auto; overflow-wrap: anywhere;
      }
      :is(#boot-frame, #boot-failure) * { box-sizing: border-box; }
      #boot-frame { pointer-events: none; }
      .boot-topbar {
        --boot-topbar-padding: var(--jf-space-6);
        display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
        min-height: var(--frame-topbar-height); gap: var(--jf-space-3); padding-block: var(--jf-space-2);
        padding-inline: var(--boot-topbar-padding) calc(var(--boot-topbar-padding) + var(--window-controls-inline, 0rem));
        background: var(--boot-frame-raised, var(--surface-1)); border-bottom: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle));
        color: var(--boot-frame-muted, var(--text-secondary)); font-size: var(--font-size-sm);
      }
      .boot-brand, .boot-areas, .boot-end, .boot-pill { display: flex; align-items: center; gap: var(--jf-space-3); }
      .boot-end { justify-content: flex-end; }
      .boot-brand { color: var(--boot-frame-text, var(--text-primary)); font-size: var(--font-size-md); font-weight: var(--jf-weight-semibold); }
      .boot-dot { display: inline-block; width: var(--frame-brand-dot); height: var(--frame-brand-dot); flex: none;
        border-radius: var(--frame-pill-radius); background: var(--boot-frame-accent, var(--accent-tint)); }
      .boot-areas, .boot-pill { border: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle)); border-radius: var(--frame-pill-radius); padding: var(--jf-space-1) var(--jf-space-4); }
      .boot-areas { gap: var(--jf-space-6); flex-wrap: wrap; }
      .boot-symbol { font-size: var(--font-size-xl); font-variation-settings: "opsz" 32; }
      #boot-failure { display: grid; align-items: safe center; justify-items: center; padding: var(--jf-space-6); }
      .boot-message { width: 100%; max-width: var(--measure-prose); text-align: center; min-width: 0; }
      .boot-message .boot-brand { justify-content: center; }
      .boot-message h1 { font-size: var(--font-size-headline); font-variation-settings: "opsz" 32; font-weight: var(--jf-weight-normal); margin: var(--jf-space-6) 0 var(--jf-space-2); }
      .boot-message p { color: var(--boot-frame-muted, var(--text-secondary)); margin: var(--jf-space-3) 0; }
      .boot-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: var(--jf-space-3); margin-top: var(--jf-space-6); }
      .boot-actions button { font: inherit; font-size: var(--font-size-sm); color: inherit; background: var(--boot-frame-raised, var(--surface-2));
        border: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle)); border-radius: var(--frame-control-radius); padding: var(--jf-space-2) var(--jf-space-4); cursor: pointer; }
      #boot-reload { border-radius: var(--frame-pill-radius); border-color: var(--boot-frame-accent, var(--accent-tint));
        background: var(--boot-frame-accent, var(--accent-tint)); color: var(--boot-frame-action-text, var(--jf-color-neutral-900)); }
      .boot-actions button:focus-visible, #boot-report:focus-visible { outline: var(--frame-focus-width) solid var(--boot-frame-accent, var(--accent-tint)); outline-offset: var(--jf-space-1); }
      .boot-message .boot-note, .boot-meta { font-size: var(--font-size-sm); }
      .boot-meta { margin-top: var(--jf-space-8); color: var(--boot-frame-muted, var(--text-secondary)); }
      #boot-report { width: 100%; min-height: var(--frame-topbar-height); margin-top: var(--jf-space-4); font: inherit;
        color: inherit; background: var(--boot-frame-raised, var(--surface-2)); border: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle)); }
      @media (max-width: 900px) { .boot-topbar { display: flex; justify-content: space-between; flex-wrap: wrap; } }
      @media (max-width: 600px) { .boot-topbar { --boot-topbar-padding: var(--jf-space-3); } .boot-areas { gap: var(--jf-space-3); } }
      /* Desktop window layer (decorations are off): outside #root, so every root replacement keeps it. */
      :root[data-window-controls] { --window-controls-inline: calc(3 * var(--frame-window-control-size) + 2 * var(--frame-window-control-gap) + var(--frame-window-control-inset)); }
      #window-controls {
        position: fixed; inset-block-start: 0; inset-inline-end: 0; z-index: var(--z-overlay-top);
        display: flex; align-items: center; gap: var(--frame-window-control-gap); box-sizing: border-box;
        block-size: var(--frame-topbar-height); padding-inline-end: var(--frame-window-control-inset);
        pointer-events: none; color: var(--window-control-ink);
        /* The colours of the surface beneath: the app's tokens, or the saved frame colours below. */
        --window-control-ink: var(--text-secondary); --window-control-strong: var(--text-primary); --window-control-fill: var(--surface-2);
      }
      :root:has(#root > :is(#boot-frame, #boot-failure)) #window-controls {
        --window-control-ink: var(--boot-frame-muted, var(--text-secondary)); --window-control-strong: var(--boot-frame-text, var(--text-primary));
      }
      /* The frame's bar is raised and the failure page is not: the hover fill is the other surface. */
      :root:has(#root > #boot-frame) #window-controls { --window-control-fill: var(--boot-frame-background, var(--surface-0)); }
      :root:has(#root > #boot-failure) #window-controls { --window-control-fill: var(--boot-frame-raised, var(--surface-1)); }
      #window-controls button {
        display: inline-grid; place-items: center; box-sizing: border-box; inline-size: var(--frame-window-control-size); block-size: var(--frame-window-control-size);
        margin: 0; padding: 0; border: 0; border-radius: var(--frame-control-radius); color: inherit; background: transparent; font: inherit;
        pointer-events: auto; cursor: default;
      }
      #window-controls button:is(:hover, :active) { color: var(--window-control-strong); background: var(--window-control-fill); }
      /* Text ink, not the accent: some palettes' accents are below 4.5:1 on their own surfaces. Drawn
         outside the control, against the surface, so a hover or pressed fill never hides it. */
      #window-controls button:focus-visible { outline: var(--frame-focus-width) solid var(--window-control-strong); outline-offset: var(--frame-hairline); }
      #window-controls svg { inline-size: var(--frame-window-control-glyph); block-size: var(--frame-window-control-glyph); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
      #window-controls[data-maximized] .window-maximize-icon, #window-controls:not([data-maximized]) .window-restore-icon { display: none; }
      /* Top areas of the static surfaces move the window. The frame paints no other input target. */
      #boot-frame .boot-topbar[data-tauri-drag-region] { pointer-events: auto; }
      [data-window-controls] #boot-failure { grid-template-rows: auto minmax(0, 1fr); padding-block-start: 0; }
      .boot-window-top { position: sticky; inset-block-start: 0; justify-self: stretch; align-self: start;
        block-size: var(--frame-topbar-height); margin-inline: calc(-1 * var(--jf-space-6)); background: inherit; }
      @media (forced-colors: active) {
        :is(#boot-frame, #boot-failure) { color: CanvasText; background: Canvas; }
        .boot-topbar, .boot-actions button, #boot-reload, #boot-report { color: ButtonText; background: ButtonFace; border-color: ButtonText; }
        .boot-brand, .boot-message p, .boot-meta { color: CanvasText; }
        .boot-areas, .boot-pill { border-color: ButtonText; }
        .boot-dot { background: Highlight; }
        .boot-actions button:focus-visible, #boot-report:focus-visible { outline-color: Highlight; }
        #window-controls button { color: ButtonText; background: transparent; }
        /* The ring is the surface's text colour; the fill is a pair that ring stays distinct from (Highlight is not). */
        #window-controls button:is(:hover, :active) { forced-color-adjust: none; color: SelectedItemText; background: SelectedItem; }
        #window-controls button:focus-visible { outline-color: CanvasText; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-frame">
        <div class="boot-topbar" aria-hidden="true">
          <span class="boot-brand"><span class="boot-dot"></span>JustSearch</span>
          <div class="boot-areas"><span>⌕ Search</span><span>▱ Library</span><span>▧ AI Brain</span></div>
          <div class="boot-end"><span class="boot-pill">Starting</span><span class="boot-symbol">⚙</span><span class="boot-symbol">⋯</span></div>
        </div>
        <span role="status" aria-label="Starting"></span>
      </div>
    </div>
    <template id="boot-failure-template">
      <div id="boot-failure" role="alert" aria-labelledby="boot-failure-title">
        <main class="boot-message">
          <div class="boot-brand"><span class="boot-dot" aria-hidden="true"></span>JustSearch</div>
          <h1 id="boot-failure-title">JustSearch couldn't open its window</h1>
          <p>The window didn't finish loading. Your files and your index are not affected,<br /> and reloading usually fixes this.</p>
          <div class="boot-actions"><button type="button" id="boot-reload">Reload</button><button type="button" id="boot-copy">Copy report</button></div>
          <p class="boot-note">The report leaves out paths and keys</p>
          <textarea id="boot-report" aria-label="Report ready to select" readonly hidden></textarea>
          <div class="boot-meta">JustSearch %JUSTSEARCH_VERSION% · window failed to load at <time></time></div>
        </main>
      </div>
    </template>
    <template id="window-controls-template">
      <div id="window-controls" role="region" aria-label="Window">
        <button type="button" data-window-command="minimize" aria-label="Minimize" title="Minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" /></svg>
        </button>
        <button type="button" data-window-command="toggle_maximize" aria-label="Maximize" title="Maximize">
          <svg class="window-maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" /></svg>
          <svg class="window-restore-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="5.5" width="7" height="7" rx="1" /><path d="M5.5 3.5h6a1 1 0 0 1 1 1v6" /></svg>
        </button>
        <button type="button" data-window-command="close" aria-label="Close" title="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>
      </div>
    </template>
    <script>
      (function () {
        var root = document.getElementById('root');
        var frame = document.getElementById('boot-frame');
        var fields = ['background', 'raised', 'text', 'muted', 'border', 'accent'];
        var query = new URLSearchParams(location.search).get('theme');
        var mode = query === 'light' || query === 'dark' ? query : null;
        try {
          if (!mode) {
            var saved = JSON.parse(localStorage.getItem('justsearch.bootFrame.v1'));
            if (saved && (saved.mode === 'light' || saved.mode === 'dark') && fields.every(function (field) {
              var value = saved[field];
              return typeof value === 'string' && value.length <= 120 && /^[a-zA-Z0-9#.,%() /+\-]+$/.test(value)
                && !/var\(|env\(|currentcolor/i.test(value) && CSS.supports('color', value);
            })) {
              // On the root, so the window layer beside #root and the failure page read them too.
              fields.forEach(function (field) { document.documentElement.style.setProperty('--boot-frame-' + field, saved[field]); });
              mode = saved.mode;
            }
          }
        } catch (_) {}
        if (!mode) mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', mode);
        frame.style.colorScheme = mode;
        // The only announcement; the visible bar is decorative and has no interactive elements.
        var status = frame.querySelector('[role="status"]');
        status.style.cssText = 'position:absolute;clip-path:inset(50%);overflow:hidden;';
        status.textContent = 'Starting';
        var layer = windowLayer();
        // Desktop only: the persistent window layer. It uses the native bridge directly and no
        // application module, and lives beside #root, so recovery, reset and the failure page keep it.
        function windowLayer() {
          var internals = window.__TAURI_INTERNALS__;
          if (!internals || typeof internals.invoke !== 'function') return null;
          var bar = frame.querySelector('.boot-topbar');
          var element = document.getElementById('window-controls-template').content.firstElementChild.cloneNode(true);
          var maximize = element.querySelector('[data-window-command="toggle_maximize"]');
          function run(name) {
            // A compositor may refuse an operation (tiling window managers): nothing to do then.
            try { return Promise.resolve(internals.invoke('plugin:window|' + name)).catch(function () { return null; }); }
            catch (_) { return Promise.resolve(null); }
          }
          var reading = false, again = false;
          function sync() {
            if (reading) { again = true; return; }
            reading = true;
            run('is_maximized').then(function (maximized) {
              if (maximized === true || maximized === false) {
                element.toggleAttribute('data-maximized', maximized);
                var label = maximized ? 'Restore' : 'Maximize';
                maximize.setAttribute('aria-label', label);
                maximize.title = label;
              }
              reading = false;
              if (again) { again = false; sync(); }
            });
          }
          var settle;
          function changed() { sync(); clearTimeout(settle); settle = setTimeout(sync, 250); }
          // Registered before any application listener, so these run ahead of the hand-off input
          // guard: the controls and the frame's top strip work while the app beneath stays blocked.
          window.addEventListener('click', function (event) {
            var button = event.target instanceof Element && element.contains(event.target) ? event.target.closest('[data-window-command]') : null;
            if (!button) return;
            var command = button.getAttribute('data-window-command');
            run(command).then(changed);
            // A control that sends the window away lets go of focus, so the window never comes back
            // with one Space or Enter from sending it away again. The app returns focus to where it
            // was (boot/desktopWindow.ts); Maximize keeps it, the window stays.
            if (command !== 'toggle_maximize' && element.contains(document.activeElement)) document.activeElement.blur();
          }, true);
          // The context-menu policy, in one place: production builds never show the web view's own
          // menu (Back, Refresh, Print, Inspect), on the top area, its drag region or the content, on
          // every page. A field the person types into keeps the platform's edit menu; the app's own
          // menus still receive the event. Development builds keep the web view menu for Inspect.
          if ('%PROD%' === 'true') window.addEventListener('contextmenu', function (event) {
            var target = event.composedPath()[0];
            var typed = target instanceof HTMLTextAreaElement
              || (target instanceof HTMLInputElement && /^(text|search|url|tel|email|password|number|date|datetime-local|month|time|week)$/.test(target.type));
            if (!(target instanceof HTMLElement && (target.isContentEditable || (typed && !target.disabled)))) event.preventDefault();
          }, true);
          window.addEventListener('mousedown', function (event) {
            if (event.button !== 0 || (event.detail !== 1 && event.detail !== 2) || frame.parentElement !== root
              || event.composedPath().indexOf(bar) < 0) return;
            // Tauri's drag-region handler, for the strip that paints before the app.
            event.preventDefault();
            event.stopImmediatePropagation();
            run(event.detail === 2 ? 'internal_toggle_maximize' : 'start_dragging');
          }, true);
          // Maximized state changes by any means (keyboard, desktop, double-click) resize the window.
          window.addEventListener('resize', changed);
          window.addEventListener('focus', changed);
          document.addEventListener('visibilitychange', changed);
          bar.setAttribute('data-tauri-drag-region', 'deep');
          document.documentElement.setAttribute('data-window-controls', '');
          root.after(element);
          sync();
          return element;
        }
        function fail(kind) {
          // Recovery/reset own #root as soon as they replace it. Never steal it back or refocus it.
          if (frame.parentElement !== root) return;
          if (['entry', 'evaluation', 'bootstrap', 'no-engine-address', 'stalled'].indexOf(kind) < 0) kind = 'bootstrap';
          var page = document.getElementById('boot-failure-template').content.firstElementChild.cloneNode(true);
          page.style.colorScheme = mode;
          if (layer) {
            var top = document.createElement('div');
            top.className = 'boot-window-top';
            top.setAttribute('data-tauri-drag-region', '');
            page.prepend(top);
          }
          var now = new Date().toISOString();
          var platform = navigator.platform;
          var report = JSON.stringify({
            productVersion: document.querySelector('meta[name="justsearch-version"]').content,
            failureKind: kind,
            runtimeKind: window.__TAURI_INTERNALS__ || window.__TAURI__ ? 'desktop' : 'browser',
            operatingSystem: /Win/.test(platform) ? 'Windows' : /Mac/.test(platform) ? 'macOS' : /Linux/.test(platform) ? 'Linux' : 'Other',
            time: now
          }, null, 2);
          page.querySelector('time').textContent = now;
          page.querySelector('time').dateTime = now;
          page.querySelector('#boot-reload').onclick = function () { location.reload(); };
          page.querySelector('#boot-copy').onclick = function () {
            function selectReport() { var field = page.querySelector('#boot-report'); field.hidden = false; field.value = report; field.focus(); field.select(); }
            try { if (!navigator.clipboard) { selectReport(); return; } Promise.resolve(navigator.clipboard.writeText(report)).catch(selectReport); }
            catch (_) { selectReport(); }
          };
          root.replaceChildren(page);
          // The cached accent can be any palette colour. Pick its contrast-safe ink from the
          // existing neutral primitives, without loading the application's role projection.
          try {
            var ctx = document.createElement('canvas').getContext('2d');
            function luminance(color) {
              ctx.fillStyle = color; ctx.fillRect(0, 0, 1, 1);
              var rgb = ctx.getImageData(0, 0, 1, 1).data;
              var channels = [rgb[0], rgb[1], rgb[2]].map(function (v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
              return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
            }
            var button = page.querySelector('#boot-reload');
            var fill = luminance(getComputedStyle(button).backgroundColor);
            var styles = getComputedStyle(page);
            var inks = ['--jf-color-neutral-0', '--jf-color-neutral-900'];
            function contrast(ink) { var value = luminance(styles.getPropertyValue(ink)); return (Math.max(fill, value) + 0.05) / (Math.min(fill, value) + 0.05); }
            page.style.setProperty('--boot-frame-action-text', 'var(' + (contrast(inks[0]) > contrast(inks[1]) ? inks[0] : inks[1]) + ')');
          } catch (_) {}
          page.querySelector('#boot-reload').focus({ preventScroll: true });
        }
        fail.started = false;
        window.__justsearchBootFailure = fail;
        function onError(event) {
          if (frame.parentElement !== root) return;
          if (event.target && event.target === document.querySelector('script[type="module"][src]')) fail('entry');
          else if (event.target === window && !fail.started) fail('evaluation');
        }
        window.addEventListener('error', onError, true);
        var listening = true;
        var expired = false;
        var deadline = setTimeout(function () { expired = true; fail('stalled'); }, 60000);
        // Desktop connecting temporarily owns the root; the retained frame can return afterwards.
        var observer = new MutationObserver(function () {
          var showing = frame.parentElement === root;
          // Connecting can own the root past the deadline. Returning the frame must not lose it.
          if (showing && expired) { fail('stalled'); showing = false; }
          if (!showing && listening) { window.removeEventListener('error', onError, true); listening = false; }
          else if (showing && !listening) { window.addEventListener('error', onError, true); listening = true; }
          if (root.querySelector('#boot-failure') || root.querySelector('jf-shell') && !showing) {
            clearTimeout(deadline); observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
