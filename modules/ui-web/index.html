<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="justsearch-version" content="%JUSTSEARCH_VERSION%" />
    <title>JustSearch</title>
    <style>
      %BOOT_FRAME_TOKENS%
      body { margin: 0; }
      :is(#boot-frame, #boot-failure) {
        box-sizing: border-box; position: fixed; inset: 0; z-index: var(--z-overlay-chrome);
        color: var(--boot-frame-text, var(--text-primary)); background: var(--boot-frame-background, var(--surface-0));
        font-family: var(--font-native); font-size: var(--font-size-md); line-height: 1.5;
        overflow: auto; overflow-wrap: anywhere;
      }
      :is(#boot-frame, #boot-failure) * { box-sizing: border-box; }
      #boot-frame { pointer-events: none; }
      .boot-topbar {
        display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
        min-height: var(--frame-topbar-height); padding: var(--jf-space-2) var(--jf-space-6); gap: var(--jf-space-3);
        background: var(--boot-frame-raised, var(--surface-1)); border-bottom: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle));
        color: var(--boot-frame-muted, var(--text-secondary)); font-size: var(--font-size-sm);
      }
      .boot-brand, .boot-areas, .boot-end, .boot-pill { display: flex; align-items: center; gap: var(--jf-space-3); }
      .boot-end { justify-content: flex-end; }
      .boot-brand { color: var(--boot-frame-text, var(--text-primary)); font-size: var(--font-size-md); font-weight: var(--jf-weight-semibold); }
      .boot-dot { display: inline-block; width: var(--frame-brand-dot); height: var(--frame-brand-dot); flex: none;
        border-radius: var(--frame-pill-radius); background: var(--boot-frame-accent, var(--accent-tint)); }
      .boot-areas, .boot-pill { border: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle)); border-radius: var(--frame-pill-radius); padding: var(--jf-space-1) var(--jf-space-4); }
      .boot-areas { gap: var(--jf-space-6); flex-wrap: wrap; }
      .boot-symbol { font-size: var(--font-size-xl); }
      #boot-failure { display: grid; align-items: safe center; justify-items: center; padding: var(--jf-space-6); }
      .boot-message { width: 100%; max-width: var(--measure-prose); text-align: center; min-width: 0; }
      .boot-message .boot-brand { justify-content: center; }
      .boot-message h1 { font-size: var(--font-size-xl); font-weight: var(--jf-weight-normal); margin: var(--jf-space-6) 0 var(--jf-space-2); }
      .boot-message p { color: var(--boot-frame-muted, var(--text-secondary)); margin: var(--jf-space-3) 0; }
      .boot-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: var(--jf-space-3); margin-top: var(--jf-space-6); }
      .boot-actions button { font: inherit; color: inherit; background: var(--boot-frame-raised, var(--surface-2));
        border: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle)); border-radius: var(--frame-control-radius); padding: var(--jf-space-2) var(--jf-space-4); cursor: pointer; }
      #boot-reload { border-radius: var(--frame-pill-radius); border-color: var(--boot-frame-accent, var(--accent-tint));
        background: var(--boot-frame-accent, var(--accent-tint)); color: var(--boot-frame-action-text, var(--jf-color-neutral-900)); }
      .boot-actions button:focus-visible, #boot-report:focus-visible { outline: var(--frame-focus-width) solid var(--boot-frame-accent, var(--accent-tint)); outline-offset: var(--jf-space-1); }
      .boot-message .boot-note, .boot-meta { font-size: var(--font-size-sm); }
      .boot-meta { margin-top: var(--jf-space-8); color: var(--boot-frame-muted, var(--text-secondary)); }
      #boot-report { width: 100%; min-height: var(--frame-topbar-height); margin-top: var(--jf-space-4); font: inherit;
        color: inherit; background: var(--boot-frame-raised, var(--surface-2)); border: var(--frame-hairline) solid var(--boot-frame-border, var(--border-subtle)); }
      @media (max-width: 900px) { .boot-topbar { display: flex; justify-content: space-between; flex-wrap: wrap; } }
      @media (max-width: 600px) { .boot-topbar { padding-inline: var(--jf-space-3); } .boot-areas { gap: var(--jf-space-3); } }
      @media (forced-colors: active) {
        :is(#boot-frame, #boot-failure) { color: CanvasText; background: Canvas; }
        .boot-topbar, .boot-actions button, #boot-reload, #boot-report { color: ButtonText; background: ButtonFace; border-color: ButtonText; }
        .boot-brand, .boot-message p, .boot-meta { color: CanvasText; }
        .boot-areas, .boot-pill { border-color: ButtonText; }
        .boot-dot { background: Highlight; }
        .boot-actions button:focus-visible, #boot-report:focus-visible { outline-color: Highlight; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-frame">
        <div class="boot-topbar" aria-hidden="true">
          <span class="boot-brand"><span class="boot-dot"></span>JustSearch</span>
          <div class="boot-areas"><span>⌕ Search</span><span>▱ Library</span><span>▧ AI Brain</span></div>
          <div class="boot-end"><span class="boot-pill">Starting</span><span class="boot-symbol">⚙</span><span class="boot-symbol">⋯</span></div>
        </div>
        <span role="status" aria-label="Starting"></span>
      </div>
    </div>
    <template id="boot-failure-template">
      <div id="boot-failure" role="alert" aria-labelledby="boot-failure-title">
        <main class="boot-message">
          <div class="boot-brand"><span class="boot-dot" aria-hidden="true"></span>JustSearch</div>
          <h1 id="boot-failure-title">JustSearch couldn't open its window</h1>
          <p>The window didn't finish loading. Your files and your index are not affected,<br /> and reloading usually fixes this.</p>
          <div class="boot-actions"><button type="button" id="boot-reload">Reload</button><button type="button" id="boot-copy">Copy report</button></div>
          <p class="boot-note">The report leaves out paths and keys</p>
          <textarea id="boot-report" aria-label="Report ready to select" readonly hidden></textarea>
          <div class="boot-meta">JustSearch %JUSTSEARCH_VERSION% · window failed to load at <time></time></div>
        </main>
      </div>
    </template>
    <script>
      (function () {
        var root = document.getElementById('root');
        var frame = document.getElementById('boot-frame');
        var fields = ['background', 'raised', 'text', 'muted', 'border', 'accent'];
        var query = new URLSearchParams(location.search).get('theme');
        var mode = query === 'light' || query === 'dark' ? query : null;
        try {
          if (!mode) {
            var saved = JSON.parse(localStorage.getItem('justsearch.bootFrame.v1'));
            if (saved && (saved.mode === 'light' || saved.mode === 'dark') && fields.every(function (field) {
              var value = saved[field];
              return typeof value === 'string' && value.length <= 120 && /^[a-zA-Z0-9#.,%() /+\-]+$/.test(value)
                && !/var\(|env\(|currentcolor/i.test(value) && CSS.supports('color', value);
            })) {
              fields.forEach(function (field) { frame.style.setProperty('--boot-frame-' + field, saved[field]); });
              mode = saved.mode;
            }
          }
        } catch (_) {}
        if (!mode) mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', mode);
        frame.style.colorScheme = mode;
        // The only announcement; the visible bar is decorative and has no interactive elements.
        var status = frame.querySelector('[role="status"]');
        status.style.cssText = 'position:absolute;clip-path:inset(50%);overflow:hidden;';
        status.textContent = 'Starting';
        function fail(kind) {
          // Recovery/reset own #root as soon as they replace it. Never steal it back or refocus it.
          if (frame.parentElement !== root) return;
          if (['entry', 'evaluation', 'bootstrap', 'no-engine-address', 'stalled'].indexOf(kind) < 0) kind = 'bootstrap';
          var page = document.getElementById('boot-failure-template').content.firstElementChild.cloneNode(true);
          fields.forEach(function (field) { var value = frame.style.getPropertyValue('--boot-frame-' + field); if (value) page.style.setProperty('--boot-frame-' + field, value); });
          page.style.colorScheme = mode;
          var now = new Date().toISOString();
          var platform = navigator.platform;
          var report = JSON.stringify({
            productVersion: document.querySelector('meta[name="justsearch-version"]').content,
            failureKind: kind,
            runtimeKind: window.__TAURI_INTERNALS__ || window.__TAURI__ ? 'desktop' : 'browser',
            operatingSystem: /Win/.test(platform) ? 'Windows' : /Mac/.test(platform) ? 'macOS' : /Linux/.test(platform) ? 'Linux' : 'Other',
            time: now
          }, null, 2);
          page.querySelector('time').textContent = now;
          page.querySelector('time').dateTime = now;
          page.querySelector('#boot-reload').onclick = function () { location.reload(); };
          page.querySelector('#boot-copy').onclick = function () {
            function selectReport() { var field = page.querySelector('#boot-report'); field.hidden = false; field.value = report; field.focus(); field.select(); }
            try { if (!navigator.clipboard) { selectReport(); return; } Promise.resolve(navigator.clipboard.writeText(report)).catch(selectReport); }
            catch (_) { selectReport(); }
          };
          root.replaceChildren(page);
          // The cached accent can be any palette colour. Pick its contrast-safe ink from the
          // existing neutral primitives, without loading the application's role projection.
          try {
            var ctx = document.createElement('canvas').getContext('2d');
            function luminance(color) {
              ctx.fillStyle = color; ctx.fillRect(0, 0, 1, 1);
              var rgb = ctx.getImageData(0, 0, 1, 1).data;
              var channels = [rgb[0], rgb[1], rgb[2]].map(function (v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
              return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
            }
            var button = page.querySelector('#boot-reload');
            var fill = luminance(getComputedStyle(button).backgroundColor);
            var styles = getComputedStyle(page);
            var inks = ['--jf-color-neutral-0', '--jf-color-neutral-900'];
            function contrast(ink) { var value = luminance(styles.getPropertyValue(ink)); return (Math.max(fill, value) + 0.05) / (Math.min(fill, value) + 0.05); }
            page.style.setProperty('--boot-frame-action-text', 'var(' + (contrast(inks[0]) > contrast(inks[1]) ? inks[0] : inks[1]) + ')');
          } catch (_) {}
          page.querySelector('#boot-reload').focus({ preventScroll: true });
        }
        fail.started = false;
        window.__justsearchBootFailure = fail;
        function onError(event) {
          if (frame.parentElement !== root) return;
          if (event.target && event.target === document.querySelector('script[type="module"][src]')) fail('entry');
          else if (event.target === window && !fail.started) fail('evaluation');
        }
        window.addEventListener('error', onError, true);
        var listening = true;
        var expired = false;
        var deadline = setTimeout(function () { expired = true; fail('stalled'); }, 60000);
        // Desktop connecting temporarily owns the root; the retained frame can return afterwards.
        var observer = new MutationObserver(function () {
          var showing = frame.parentElement === root;
          // Connecting can own the root past the deadline. Returning the frame must not lose it.
          if (showing && expired) { fail('stalled'); showing = false; }
          if (!showing && listening) { window.removeEventListener('error', onError, true); listening = false; }
          else if (showing && !listening) { window.addEventListener('error', onError, true); listening = true; }
          if (root.querySelector('#boot-failure') || root.querySelector('jf-shell') && !showing) {
            clearTimeout(deadline); observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
