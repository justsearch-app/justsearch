[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsharness"
version = "0.1.0"
description = "JustSearch UI checks and process registers"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
ui = ["playwright>=1.40"]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
jsharness = "jsharness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jsharness*"]

[tool.setuptools.package-data]
jsharness = ["ui_step_index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
